<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GlassHouse Trivia — Host</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --nav:   #08121F; --nav2: #0D1E30; --nav3: #112236;
  --cyan:  #00C8FF; --cglow: rgba(0,200,255,0.2);
  --white: #FFFFFF; --dim:   #7AAABB; --dim2: #3A5060;
  --gold:  #FFD700; --green: #00E676; --red: #FF5252;
  --orange:#FFB74D;
}
body { font-family:'Segoe UI',Calibri,Arial,sans-serif; background:var(--nav); color:var(--white); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,200,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.05) 1px,transparent 1px); background-size:38px 38px; pointer-events:none; z-index:0; }

/* ── Header ── */
#hdr { display:flex; align-items:center; justify-content:space-between; padding:0 18px; height:52px; background:rgba(8,18,31,.97); border-bottom:2px solid var(--cyan); flex-shrink:0; position:relative; z-index:10; }
.logo { font-family:'Arial Black',Arial,sans-serif; font-size:15px; }
.logo em { color:var(--cyan); font-style:normal; }
#score-bar { display:flex; gap:8px; }
.sc-chip { display:flex; flex-direction:column; align-items:center; padding:3px 11px 4px; border-radius:4px; border:1.5px solid; min-width:70px; }
.sc-chip .sc-n { font-size:9px; opacity:.7; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; overflow:hidden; max-width:80px; text-overflow:ellipsis; }
.sc-chip .sc-v { font-family:'Arial Black',Arial,sans-serif; font-size:21px; line-height:1.1; }
.hdr-r { display:flex; gap:7px; }
.btn-hdr { padding:5px 10px; border-radius:4px; border:1px solid rgba(0,200,255,.35); background:rgba(0,200,255,.07); color:var(--cyan); font-size:11.5px; cursor:pointer; transition:background .15s; white-space:nowrap; }
.btn-hdr:hover { background:rgba(0,200,255,.15); }
.btn-hdr.on { background:rgba(0,200,255,.22); border-color:var(--cyan); }

/* ── Layout ── */
#main { display:flex; flex:1; overflow:hidden; position:relative; z-index:1; }
#display { flex:1; display:flex; align-items:center; justify-content:center; padding:14px; overflow:hidden; min-width:0; }
#host { width:400px; flex-shrink:0; border-left:1px solid rgba(0,200,255,.15); background:rgba(8,18,31,.92); overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; transition:width .3s, opacity .3s; }
#host.proj { width:0; opacity:0; overflow:hidden; }

/* ── Slide display ── */
.slide { width:100%; height:100%; border-radius:8px; position:relative; display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,200,255,.08),0 0 0 1px rgba(0,200,255,.12); overflow:hidden; background:var(--nav2); }

/* Setup */
#setup-screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
.sw { width:100%; max-width:860px; }
.sh { text-align:center; margin-bottom:26px; }
.sh h1 { font-family:'Arial Black',Arial,sans-serif; font-size:32px; color:var(--cyan); text-shadow:0 0 30px var(--cglow); margin-bottom:4px; }
.sh p { color:var(--dim); font-size:13px; }
.tc-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
.tc { background:var(--nav3); border:1.5px solid; border-radius:8px; overflow:hidden; }
.tc-h { display:flex; align-items:center; gap:8px; padding:9px 13px 7px; border-bottom:1px solid rgba(255,255,255,.06); }
.tc-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.tc-h input.tcn { flex:1; background:transparent; border:none; font-family:'Arial Black',Arial,sans-serif; font-size:14px; padding:0; min-width:0; }
.tc-h input.tcn:focus { outline:none; }
.tc-h input.tcn::placeholder { opacity:.4; }
.tc-b { padding:9px 13px 11px; }
.tc-lbl { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim2); margin-bottom:6px; }
.tc-mems { display:flex; flex-direction:column; gap:4px; }
.tc-mems input { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:3px; padding:4px 7px; color:var(--white); font-size:12px; font-family:inherit; }
.tc-mems input:focus { outline:none; border-color:rgba(255,255,255,.28); }
.tc-mems input::placeholder { color:rgba(255,255,255,.22); }
/* Emoji row in setup */
.tc-emoji-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.tc-emoji-input { width:48px; font-size:22px; text-align:center; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:4px; padding:3px 4px; color:var(--white); }
.tc-emoji-input:focus { outline:none; border-color:rgba(255,255,255,.3); }
.emoji-presets { display:flex; gap:4px; flex-wrap:wrap; }
.ep { font-size:16px; cursor:pointer; padding:2px 4px; border-radius:3px; transition:background .1s; border:none; background:rgba(255,255,255,.05); }
.ep:hover { background:rgba(255,255,255,.12); }
.btn-start { display:block; width:100%; padding:13px; background:var(--cyan); color:var(--nav); border:none; border-radius:7px; font-family:'Arial Black',Arial,sans-serif; font-size:16px; cursor:pointer; letter-spacing:1.5px; transition:opacity .15s,transform .1s; }
.btn-start:hover { opacity:.88; transform:translateY(-1px); }

/* Round intro */
.slide-ri { display:flex; flex-direction:column; justify-content:center; padding:36px 44px 36px 52px; height:100%; }
.ri-lbl { font-size:12px; letter-spacing:4px; text-transform:uppercase; margin-bottom:4px; opacity:.8; }
.ri-num { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(80px,15vw,170px); line-height:.82; margin-bottom:12px; }
.ri-name { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(20px,3.5vw,40px); margin-bottom:10px; }
.ri-sub { font-size:14px; color:var(--dim); letter-spacing:1px; }
.ri-note { margin-top:8px; font-size:11.5px; opacity:.55; }
.ri-prompt { margin-top:18px; font-size:11px; color:rgba(255,255,255,.2); }

/* Question */
.slide-q { display:flex; flex-direction:column; height:100%; }
.q-bar { display:flex; align-items:center; justify-content:space-between; padding:10px 18px; font-size:12px; border-bottom:1px solid rgba(255,255,255,.06); flex-shrink:0; }
.q-cat { font-weight:700; letter-spacing:.4px; }
.q-pos { opacity:.45; }
.q-accent { height:3px; flex-shrink:0; }
.q-body { flex:1; display:flex; align-items:center; justify-content:center; padding:28px 38px; text-align:center; overflow:hidden; }
.q-text { font-size:clamp(15px,2.1vw,27px); line-height:1.55; white-space:pre-wrap; font-weight:500; }
.q-diff { position:absolute; top:46px; right:12px; font-size:10px; letter-spacing:1px; padding:2px 6px; border-radius:10px; opacity:.55; text-transform:uppercase; }
.q-answer { flex-shrink:0; border-top:2.5px solid; padding:14px 38px 18px; text-align:center; max-height:0; overflow:hidden; opacity:0; transition:max-height .4s ease, opacity .35s ease; }
.q-answer.shown { max-height:200px; opacity:1; }
.qa-lbl { font-size:10px; letter-spacing:3px; opacity:.7; margin-bottom:4px; }
.qa-text { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(18px,3vw,38px); line-height:1.2; white-space:pre-wrap; }

/* Final */
.slide-final { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px 40px; height:100%; overflow-y:auto; }
.f-h1 { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(28px,4vw,52px); color:var(--cyan); text-shadow:0 0 30px var(--cglow); margin-bottom:6px; }
.f-winner-name { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(22px,3.5vw,44px); margin-bottom:4px; }
.f-winner-members { font-size:13px; color:var(--dim); margin-bottom:18px; }
.f-sub { color:var(--dim); font-size:13px; margin-bottom:14px; }
.f-scores { display:flex; gap:14px; width:100%; max-width:580px; margin-bottom:18px; }
.f-team { flex:1; text-align:center; }
.f-score { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(28px,4.5vw,50px); line-height:1; margin-bottom:3px; }
.f-name { font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:.8; }
.f-prize { font-size:clamp(12px,1.4vw,15px); color:var(--dim); padding:10px 20px; border:1px solid rgba(255,255,255,.12); border-radius:6px; background:rgba(255,255,255,.03); max-width:460px; }
.f-hat-img { width:100px; height:auto; display:block; margin:10px auto 6px; }

/* Scoreboard overlay */
#sb { position:fixed; inset:0; background:rgba(5,11,20,.97); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px; }
#sb.hidden { display:none; }
.sb-h { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(32px,5vw,52px); color:var(--cyan); text-shadow:0 0 40px var(--cglow); text-align:center; margin-bottom:4px; }
.sb-sub { color:var(--dim); font-size:14px; text-align:center; margin-bottom:32px; }
.sb-cols { display:flex; gap:20px; align-items:flex-end; width:100%; max-width:820px; }
.sb-col { flex:1; display:flex; flex-direction:column; align-items:center; }
.sb-bw { width:100%; height:190px; display:flex; align-items:flex-end; justify-content:center; margin-bottom:9px; }
.sb-bar { width:62%; border-radius:4px 4px 0 0; min-height:4px; }
.sb-score { font-family:'Arial Black',Arial,sans-serif; font-size:40px; line-height:1; margin-bottom:3px; }
.sb-name { font-size:12px; text-transform:uppercase; letter-spacing:.8px; opacity:.8; text-align:center; }
.sb-emoji { font-size:22px; margin-bottom:2px; }
.sb-mems { font-size:10.5px; opacity:.4; margin-top:2px; text-align:center; max-width:110px; }
.btn-sb-close { margin-top:28px; padding:9px 28px; border-radius:6px; font-size:13px; cursor:pointer; letter-spacing:.8px; background:transparent; color:var(--cyan); border:1.5px solid var(--cyan); transition:background .15s; }
.btn-sb-close:hover { background:rgba(0,200,255,.1); }

/* ── Host sidebar ── */
.hp { padding:11px 14px; border-bottom:1px solid rgba(255,255,255,.05); flex-shrink:0; }
.hp:last-child { border-bottom:none; }
.hp-lbl { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--dim2); margin-bottom:8px; }

/* Nav — TOP of sidebar */
.nav-row { display:flex; gap:6px; }
.btn-nav { flex:1; padding:9px 6px; border-radius:5px; border:1.5px solid rgba(0,200,255,.3); background:rgba(0,200,255,.05); color:var(--cyan); font-size:13px; font-weight:700; cursor:pointer; transition:background .12s; }
.btn-nav:hover { background:rgba(0,200,255,.1); }
.btn-nav.pri { background:var(--cyan); color:var(--nav); border-color:var(--cyan); }
.btn-nav.pri:hover { opacity:.88; }

/* Reveal */
.btn-rev { width:100%; padding:9px; border-radius:5px; border:2px solid; font-size:13px; font-weight:700; cursor:pointer; letter-spacing:.8px; transition:all .15s; }
.btn-rev.show { background:var(--green); border-color:var(--green); color:var(--nav); }
.btn-rev.hide { background:transparent; border-color:rgba(255,255,255,.18); color:var(--dim); }

/* Position info */
.pos-txt { font-family:'Arial Black',Arial,sans-serif; font-size:15px; margin-bottom:2px; }
.pos-sub { font-size:11.5px; color:var(--dim); }

/* Timer */
#timer-val { font-family:'Arial Black',Arial,sans-serif; font-size:50px; text-align:center; line-height:1; margin:4px 0 7px; transition:color .4s; }
.timer-row { display:flex; gap:6px; }
.btn-t { flex:1; padding:6px; border-radius:4px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:var(--white); font-size:11.5px; cursor:pointer; transition:background .12s; }
.btn-t:hover { background:rgba(255,255,255,.08); }
.btn-t.on { background:rgba(0,200,255,.12); border-color:var(--cyan); color:var(--cyan); }

/* Correct answer (host-only preview) */
.host-ans-box { background:rgba(0,230,118,.08); border:1px solid rgba(0,230,118,.25); border-radius:5px; padding:8px 10px; margin-top:2px; }
.host-ans-lbl { font-size:9px; letter-spacing:2px; color:var(--green); text-transform:uppercase; margin-bottom:3px; opacity:.8; }
.host-ans-txt { font-size:14px; font-weight:700; color:var(--white); white-space:pre-wrap; line-height:1.35; }

/* Team answer rows */
.team-row { border:1px solid rgba(255,255,255,.07); border-radius:6px; overflow:hidden; margin-bottom:7px; }
.team-row:last-child { margin-bottom:0; }
.tr-head { display:flex; align-items:center; justify-content:space-between; padding:5px 9px; }
.tr-dot { width:7px; height:7px; border-radius:50%; margin-right:6px; flex-shrink:0; }
.tr-nw { display:flex; align-items:center; flex:1; min-width:0; }
.tr-name { font-size:11.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tr-score { font-family:'Arial Black',Arial,sans-serif; font-size:17px; }
.tr-ans { padding:9px 11px; background:rgba(0,0,0,.2); font-size:14px; min-height:38px; }
.tr-ans-txt { color:var(--white); font-size:15px; font-weight:600; line-height:1.45; white-space:pre-wrap; }
.tr-ans-pending { color:var(--dim2); font-style:italic; font-size:12px; }
.tr-ans-received { color:var(--green); font-size:13px; font-weight:700; }
.tr-ans-none { color:var(--dim2); font-size:12px; font-style:italic; }
.tr-btns { display:flex; gap:5px; padding:5px 8px; background:rgba(0,0,0,.15); }
.btn-ok { flex:1; padding:5px 6px; border-radius:3px; border:none; font-size:12px; font-weight:700; cursor:pointer; transition:opacity .12s,transform .1s; }
.btn-ok:hover { opacity:.8; transform:scale(1.04); }
.btn-ok.yes { background:var(--green); color:var(--nav); }
.btn-ok.no  { background:rgba(255,82,82,.18); color:var(--red); border:1px solid rgba(255,82,82,.35); }
.tr-result { font-size:10px; text-align:center; padding:2px; font-weight:700; letter-spacing:1px; }

.btn-sb-trigger { width:100%; padding:8px; border-radius:5px; border:1px solid rgba(255,215,0,.28); background:rgba(255,215,0,.04); color:var(--gold); font-size:12px; cursor:pointer; letter-spacing:.8px; transition:background .12s; }
.btn-sb-trigger:hover { background:rgba(255,215,0,.09); }
.keys { font-size:10.5px; color:rgba(255,255,255,.27); line-height:1.9; }
.keys b { color:rgba(255,255,255,.52); }

/* Scrollbar */
#host::-webkit-scrollbar { width:3px; }
#host::-webkit-scrollbar-thumb { background:rgba(0,200,255,.18); border-radius:2px; }

/* Utils */
.hidden { display:none !important; }
@keyframes fadeSlide { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
.fade-in { animation:fadeSlide .35s ease both; }
@keyframes pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.35)} }
.pop { animation:pop .35s ease; }
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">Glass<em>House</em> <span style="opacity:.5;font-size:12px;font-family:Calibri,sans-serif;font-weight:normal;">HOST</span></div>
  <div id="score-bar"></div>
  <div class="hdr-r">
    <button class="btn-hdr" id="btn-proj" onclick="toggleProj()">⊞ Projector</button>
    <button class="btn-hdr" onclick="emit('host:scoreboard')">★ Scoreboard</button>
  </div>
</div>

<div id="main">
  <div id="display"></div>
  <div id="host"></div>
</div>

<div id="sb" class="hidden">
  <div class="sb-h">SCOREBOARD</div>
  <div class="sb-sub" id="sb-sub"></div>
  <div class="sb-cols" id="sb-cols"></div>
  <button class="btn-sb-close" onclick="closeSb()">CONTINUE ▶</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>

// ── Local ROUNDS copy (host always sees correct answers) ─────────────────────
const ROUNDS = [
  { name:'General Knowledge', color:'#00C8FF', questions:[
    {q:'How many bones does an adult human body have?',a:'206',d:2},
    {q:'What is the ONLY country in the world that borders both Spain AND France?',a:'Andorra',d:3},

  ]},
  { name:'World History', color:'#FFD700', questions:[
    {q:'In what year did the Berlin Wall fall?',a:'1989',d:1},
    {q:'Who was the first woman to win a Nobel Prize?',a:'Marie Curie (1903 · Physics)',d:2},
    {q:'How many amendments does the United States Constitution currently have?',a:'27 amendments',d:3},
    {q:'The Black Death of the 14th century killed approximately what fraction of Europe\'s population?\n(Accept a range)',a:'One-third to one-half (accept 30–60%)',d:3},

  ]},
  { name:'Name That Tune', color:'#BB86FC', note:'Host plays a clip — name the song AND artist. All songs from 1980 onward.', questions:[
    {q:'Song 1',a:'—',d:1},
    {q:'Song 2',a:'—',d:2},
    {q:'Song 3',a:'—',d:2},
    {q:'Song 4',a:'—',d:3},
    {q:'Song 5',a:'—',d:3},
  ]},
  { name:'Movie Quotes', color:'#FF6B6B', note:'Name the film (and actor/character when asked). All films from 1980 onward.', questions:[

  ]},
  { name:'Sports & Pop Culture', color:'#FFD700', questions:[

    {q:'What city hosted the 2024 Summer Olympics?',a:'Paris, France',d:1},

    {q:'What spice — harvested from the stigmas of a specific flower — is the most expensive spice in the world by weight?',a:'Saffron',d:3},
    {q:'Which country consumes the most chocolate per capita in the world?',a:'Switzerland',d:2},
    {q:'"Ceviche" is a dish where raw seafood is "cooked" without heat.\nWhat country is credited as its origin, and what acid is traditionally used to cure the fish?',a:'Peru · Lime juice (citric acid)',d:3},
  ]},
];

const DIFF_LABEL = {1:'Easy',2:'Medium',3:'Hard'};
const DIFF_COLOR = {1:'rgba(0,230,118,.5)',2:'rgba(255,183,77,.5)',3:'rgba(255,82,82,.5)'};
const TEAM_COLORS = ['#00C8FF','#FF6B6B','#FFD700','#00E676'];
const EMOJI_SUGGESTIONS = ['🦁','🐯','🦊','🦅','🐺','🐻','🦈','🦋','🐉','🦄','🍺','🎯'];

// ── Socket ────────────────────────────────────────────────────────────────────
const socket = io();
socket.emit('register:host');

let S = null;
let T = { sec:30, running:false };

function emit(ev, data) { socket.emit(ev, data); }

socket.on('state', s => { S = s; render(); });
socket.on('timer', t => { T = t; refreshTimer(); });

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (!S || S.phase === 'setup') return;
  switch(e.key) {
    case ' ': case 'ArrowRight': e.preventDefault(); emit('host:next'); break;
    case 'ArrowLeft':            e.preventDefault(); emit('host:prev'); break;
    case 'a': case 'A':          if (S.phase==='q') emit('host:reveal'); break;
    case 't': case 'T':          emit('host:timer',{action: T.running?'stop':'start'}); break;
    case 'r': case 'R':          emit('host:timer',{action:'reset'}); break;
    case 's': case 'S':          emit('host:scoreboard'); break;
    case 'p': case 'P':          toggleProj(); break;
    case 'Escape':               closeSb(); break;
  }
});

// ── Projector mode ────────────────────────────────────────────────────────────
let projOn = false;
function toggleProj() {
  projOn = !projOn;
  document.getElementById('host').classList.toggle('proj', projOn);
  const b = document.getElementById('btn-proj');
  b.textContent = projOn ? '⊞ Exit Projector' : '⊞ Projector';
  b.classList.toggle('on', projOn);
}

// ── Scoreboard ────────────────────────────────────────────────────────────────
function openSb() {
  if (!S) return;
  const el = document.getElementById('sb');
  const totalQ = 9 * 5;
  document.getElementById('sb-sub').textContent =
    S.phase === 'final'
      ? `Final Standings · ${totalQ} questions played`
      : `After Round ${S.round} · standings so far`;
  const maxSc = Math.max(...S.teams.map(t=>t.score), 1);
  document.getElementById('sb-cols').innerHTML = S.teams.map(t => {
    const h = Math.max((t.score/maxSc)*180, 4);
    const mems = (t.members||[]).filter(Boolean).join(', ');
    return `<div class="sb-col">
      <div class="sb-bw"><div class="sb-bar" style="background:${t.color};height:${h}px;box-shadow:0 0 14px ${t.color}66;"></div></div>
      ${t.emoji?`<div class="sb-emoji">${t.emoji}</div>`:''}
      <div class="sb-score" style="color:${t.color};text-shadow:0 0 18px ${t.color}55">${t.score}</div>
      <div class="sb-name" style="color:${t.color}">${esc(t.name)}</div>
      ${mems?`<div class="sb-mems">${esc(mems)}</div>`:''}
    </div>`;
  }).join('');
  el.classList.remove('hidden');
}
function closeSb() { document.getElementById('sb').classList.add('hidden'); }

// ── Render ────────────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render() {
  if (!S) return;
  renderScoreBar();
  renderDisplay();
  renderHost();
  if (S.scoreboardOpen) openSb(); else closeSb();
}

function renderScoreBar() {
  if (!S || S.phase==='setup') { document.getElementById('score-bar').innerHTML=''; return; }
  document.getElementById('score-bar').innerHTML = S.teams.map((t,i)=>`
    <div class="sc-chip" style="color:${t.color};border-color:${t.color}44;">
      <div class="sc-n">${t.emoji?t.emoji+' ':''}${esc(t.name)}</div>
      <div class="sc-v" id="scv-${i}">${t.score}</div>
    </div>`).join('');
}

function refreshTimer() {
  const el = document.getElementById('timer-val');
  if (!el) return;
  el.textContent = T.sec;
  el.style.color = T.sec<=5?'var(--red)':T.sec<=10?'var(--orange)':'var(--green)';
  const btn = document.getElementById('btn-tt');
  if(btn){ btn.textContent=T.running?'⏸ Pause':'▶ Start'; btn.className='btn-t'+(T.running?' on':''); }
}

function renderDisplay() {
  const el = document.getElementById('display');
  if (!S) return;
  if (S.phase==='setup') { el.innerHTML=renderSetup(); bindSetup(); return; }
  if (S.phase==='ri')    { el.innerHTML=renderRI();    return; }
  if (S.phase==='q')     { el.innerHTML=renderQ();     return; }
  if (S.phase==='final') { el.innerHTML=renderFinal(); return; }
}

function renderSetup() {
  return `<div id="setup-screen"><div class="sw">
    <div class="sh"><h1>TRIVIA NIGHT</h1><p>GlassHouse · Q2 2026 · Enter team names, members &amp; mascot emoji, then start</p></div>
    <div class="tc-grid">
      ${[0,1,2,3].map(i=>`
        <div class="tc" style="border-color:${TEAM_COLORS[i]}44;">
          <div class="tc-h" style="background:${TEAM_COLORS[i]}12;">
            <div class="tc-dot" style="background:${TEAM_COLORS[i]}"></div>
            <input class="tcn" id="tn-${i}" type="text" placeholder="Team ${i+1} Name" maxlength="22"
              style="color:${TEAM_COLORS[i]}" value=""/>
          </div>
          <div class="tc-b">
            <div class="tc-lbl" style="margin-bottom:4px;">Team Mascot</div>
            <div class="tc-emoji-row">
              <input class="tc-emoji-input" id="te-${i}" type="text" maxlength="2" placeholder="🏆">
              <div class="emoji-presets" id="ep-${i}">
                ${EMOJI_SUGGESTIONS.map(e=>`<button class="ep" onclick="pickEmoji(${i},'${e}')">${e}</button>`).join('')}
              </div>
            </div>
            <div class="tc-lbl">Team Members</div>
            <div class="tc-mems">
              ${[0,1,2,3,4].map(m=>`<input id="tm-${i}-${m}" type="text" placeholder="Member ${m+1}" maxlength="30" value=""/>`).join('')}
            </div>
          </div>
        </div>`).join('')}
    </div>
    <button class="btn-start" id="btn-start">START GAME ▶</button>
  </div></div>`;
}

function pickEmoji(teamIdx, emoji) {
  const input = document.getElementById(`te-${teamIdx}`);
  if (input) input.value = emoji;
}

function bindSetup() {
  document.getElementById('btn-start').onclick = () => {
    const teams = [0,1,2,3].map(i=>({
      name:    document.getElementById(`tn-${i}`).value.trim()||`Team ${i+1}`,
      emoji:   document.getElementById(`te-${i}`).value.trim()||'',
      members: [0,1,2,3,4].map(m=>document.getElementById(`tm-${i}-${m}`).value.trim()).filter(Boolean),
    }));
    emit('host:setup', teams);
  };
}

function renderRI() {
  const col = S.roundColor;
  return `<div class="slide fade-in" style="background:${col}0D;border:1px solid ${col}2A;">
    <div style="position:absolute;left:0;top:0;width:6px;height:100%;background:${col};border-radius:8px 0 0 8px;"></div>
    <div class="slide-ri" style="padding-left:52px;">
      <div class="ri-lbl" style="color:${col}">ROUND ${S.roundNum} OF ${S.roundTotal}</div>
      <div class="ri-num" style="color:${col}">${S.roundNum}</div>
      <div class="ri-name" style="color:${col}">${esc(S.roundName)}</div>
      <div class="ri-sub">5 Questions · Points Up For Grabs</div>
      ${S.roundNote?`<div class="ri-note" style="color:${col}">${esc(S.roundNote)}</div>`:''}
      <div class="ri-prompt">Press Space or → to begin</div>
    </div>
  </div>`;
}

function renderQ() {
  const col = S.roundColor;
  const localQ = ROUNDS[S.round]?.questions[S.qIdx];
  const diff = localQ?.d;
  return `<div class="slide fade-in" style="background:var(--nav2);border:1px solid ${col}22;">
    <div class="slide-q">
      <div class="q-bar" style="border-bottom-color:${col}2A;">
        <span class="q-cat" style="color:${col}">Round ${S.roundNum} · ${esc(S.roundName)}</span>
        <span class="q-pos">Q${S.qIdx+1} / ${S.qTotal}</span>
      </div>
      <div class="q-accent" style="background:${col};"></div>
      <div class="q-body"><div class="q-text">${esc(S.qText)}</div></div>
      <div class="q-answer ${S.answerShown?'shown':''}" style="border-top-color:${col};background:${col}0F;">
        <div class="qa-lbl" style="color:${col}">ANSWER</div>
        <div class="qa-text">${esc(S.aText)}</div>
      </div>
    </div>
    ${diff?`<div class="q-diff" style="background:${DIFF_COLOR[diff]}">${DIFF_LABEL[diff]}</div>`:''}
  </div>`;
}

function renderFinal() {
  const sorted = [...S.teams].map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const winner = sorted[0];
  const winMembers = (winner.members||[]).filter(Boolean);
  const medals = ['🥇','🥈','🥉'];

  return `<div class="slide fade-in" style="background:var(--nav2);border:1px solid rgba(0,200,255,.2);">
    <div class="slide-final">
      <div class="f-h1">🎉 CONGRATULATIONS!</div>
      <div class="f-winner-name" style="color:${winner.color};text-shadow:0 0 20px ${winner.color}55;">
        ${winner.emoji?winner.emoji+' ':''}${esc(winner.name)}
      </div>
      ${winMembers.length?`<div class="f-winner-members">${winMembers.map(m=>esc(m)).join(' · ')}</div>`:''}
      <div class="f-sub">Final Standings · 45 questions played</div>
      <div class="f-scores">
        ${sorted.map((t,rank)=>`<div class="f-team">
          <div style="font-size:20px;margin-bottom:2px;">${medals[rank]||rank+1}</div>
          <div class="f-score" style="color:${t.color};">${t.score}</div>
          <div class="f-name" style="color:${t.color}">${t.emoji?t.emoji+' ':''}${esc(t.name)}</div>
        </div>`).join('')}
      </div>
      <img src="hat.png" alt="Prize hat" class="f-hat-img" onerror="this.style.display='none'">
      <div class="f-prize">🎩 The winning team each takes home a GlassHouse company hat! Great game, everyone!</div>
    </div>
  </div>`;
}

function renderHost() {
  const el = document.getElementById('host');
  if (!S || S.phase==='setup'||S.phase==='final') { el.innerHTML=''; return; }
  const isQ = S.phase==='q';
  const col = S.roundColor;
  const localQ = isQ ? ROUNDS[S.round]?.questions[S.qIdx] : null;

  el.innerHTML = `
    <!-- NAV — always at top -->
    <div class="hp">
      <div class="hp-lbl">Navigation</div>
      <div class="nav-row">
        <button class="btn-nav" onclick="emit('host:prev')">← Prev</button>
        <button class="btn-nav pri" onclick="emit('host:next')">Next →</button>
      </div>
    </div>

    ${isQ ? `<!-- Reveal -->
    <div class="hp">
      <button class="btn-rev ${S.answerShown?'hide':'show'}" onclick="emit('host:reveal')">
        ${S.answerShown?'↑ Hide Answer':'▶ Reveal Answer'}
      </button>
    </div>` : ''}

    <!-- Position -->
    <div class="hp">
      <div class="hp-lbl">Now Playing</div>
      <div class="pos-txt" style="color:${col}">Round ${S.roundNum}${isQ?', Q'+(S.qIdx+1):' — Intro'}</div>
      <div class="pos-sub">${esc(S.roundName)}</div>
    </div>

    ${isQ ? `<!-- Timer -->
    <div class="hp">
      <div class="hp-lbl">Timer</div>
      <div id="timer-val">${T.sec}</div>
      <div class="timer-row">
        <button class="btn-t ${T.running?'on':''}" id="btn-tt"
          onclick="emit('host:timer',{action:'${T.running?'stop':'start'}'})">
          ${T.running?'⏸ Pause':'▶ Start'}
        </button>
        <button class="btn-t" onclick="emit('host:timer',{action:'reset'})">↺ Reset</button>
      </div>
    </div>

    <!-- Correct answer (host only — always visible) -->
    ${localQ?`<div class="hp">
      <div class="hp-lbl">Correct Answer (Host Only)</div>
      <div class="host-ans-box">
        <div class="host-ans-lbl">Answer</div>
        <div class="host-ans-txt">${esc(localQ.a)}</div>
      </div>
    </div>`:''}

    <!-- Live team answers -->
    <div class="hp">
      <div class="hp-lbl">Team Answers <span style="opacity:.4;font-size:9px;">(live from players)</span></div>
      ${S.teams.map((t,i)=>{
        const ans = S.answers[i]||{answer:'',submitted:false};
        const res = S.results[i];
        const resultBar = res==='correct'
          ? `<div class="tr-result" style="background:rgba(0,230,118,.15);color:var(--green)">✓ CORRECT</div>`
          : res==='wrong'
            ? `<div class="tr-result" style="background:rgba(255,82,82,.1);color:var(--red)">✗ WRONG</div>`
            : '';
        return `<div class="team-row" style="border-color:${t.color}2A;" id="tr-${i}">
          <div class="tr-head" style="background:${t.color}12;">
            <div class="tr-nw">
              <div class="tr-dot" style="background:${t.color}"></div>
              <div class="tr-name" style="color:${t.color}">${t.emoji?t.emoji+' ':''}${esc(t.name)}</div>
            </div>
            <div class="tr-score" style="color:${t.color}">${t.score}</div>
          </div>
          <div class="tr-ans">
            ${ans.submitted
              ? `<span class="tr-ans-txt">${esc(ans.answer)}</span>`
              : `<span class="tr-ans-pending">Waiting for answer…</span>`}
          </div>
          ${resultBar}
          <div class="tr-btns">
            <button class="btn-ok yes" onclick="addPt(${i})">✓ +1</button>
            <button class="btn-ok no"  onclick="subPt(${i})">✗ Undo</button>
          </div>
        </div>`;
      }).join('')}
    </div>` : ''}

    <!-- Scoreboard -->
    <div class="hp">
      <button class="btn-sb-trigger" onclick="emit('host:scoreboard')">★ Toggle Scoreboard</button>
    </div>

    <!-- Keys -->
    <div class="hp">
      <div class="hp-lbl">Shortcuts</div>
      <div class="keys">
        <b>Space / →</b> Next &nbsp; <b>←</b> Prev<br>
        <b>A</b> Reveal &nbsp; <b>T</b> Timer &nbsp; <b>R</b> Reset timer<br>
        <b>S</b> Scoreboard &nbsp; <b>P</b> Projector &nbsp; <b>Esc</b> Close
      </div>
    </div>
  `;

  refreshTimer();
}

function addPt(ti) { emit('host:score',{teamIdx:ti,delta:1}); }
function subPt(ti) { emit('host:score',{teamIdx:ti,delta:-1}); }

// Initial render with empty state
S = { phase:'setup', teams:[
  {name:'Team 1',members:[],score:0,color:'#00C8FF',emoji:''},
  {name:'Team 2',members:[],score:0,color:'#FF6B6B',emoji:''},
  {name:'Team 3',members:[],score:0,color:'#FFD700',emoji:''},
  {name:'Team 4',members:[],score:0,color:'#00E676',emoji:''},
]};
render();
</script>
</body>
</html>
