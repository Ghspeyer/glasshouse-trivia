<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GlassHouse Trivia — Host</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --nav:   #0A1218; --nav2: #0E1C28; --nav3: #122030;
  --cyan:  #F47820; --cglow: rgba(244,120,32,0.22);
  --white: #FFFFFF; --dim:   #B08060; --dim2: #4A3828;
  --gold:  #FFD700; --green: #00E676; --red: #FF5252;
  --orange:#F47820;
}
body { font-family:'Segoe UI',Calibri,Arial,sans-serif; background:var(--nav); color:var(--white); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(244,120,32,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(244,120,32,.04) 1px,transparent 1px); background-size:38px 38px; pointer-events:none; z-index:0; }

/* ── Header ── */
#hdr { display:flex; align-items:center; justify-content:space-between; padding:0 14px; height:52px; background:rgba(8,18,31,.97); border-bottom:2px solid var(--cyan); flex-shrink:0; position:relative; z-index:10; gap:8px; }
.logo { font-family:'Arial Black',Arial,sans-serif; font-size:14px; white-space:nowrap; }
.logo em { color:var(--cyan); font-style:normal; }
#score-bar { display:flex; gap:6px; flex:1; justify-content:center; overflow:hidden; }
.sc-chip { display:flex; flex-direction:column; align-items:center; padding:2px 9px 3px; border-radius:4px; border:1.5px solid; min-width:64px; }
.sc-chip .sc-n { font-size:8px; opacity:.7; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; overflow:hidden; max-width:80px; text-overflow:ellipsis; }
.sc-chip .sc-v { font-family:'Arial Black',Arial,sans-serif; font-size:19px; line-height:1.1; }
.hdr-r { display:flex; gap:5px; flex-shrink:0; }
.btn-hdr { padding:4px 9px; border-radius:4px; border:1px solid rgba(244,120,32,.25); background:rgba(244,120,32,.05); color:rgba(255,255,255,.75); font-size:11px; cursor:pointer; transition:background .15s; white-space:nowrap; }
.btn-hdr:hover { background:rgba(244,120,32,.12); color:rgba(255,255,255,.95); }
.btn-hdr.on { background:rgba(244,120,32,.18); border-color:rgba(244,120,32,.5); color:#fff; }
.btn-hdr.danger { border-color:rgba(255,82,82,.4); color:var(--red); background:rgba(255,82,82,.07); }
.btn-hdr.danger:hover { background:rgba(255,82,82,.14); }
.btn-hdr.danger.confirming { background:rgba(255,82,82,.2); border-color:var(--red); }

/* ── Layout ── */
#main { display:flex; flex:1; overflow:hidden; position:relative; z-index:1; }
#display { flex:1; display:flex; align-items:center; justify-content:center; padding:14px; overflow:hidden; min-width:0; }
#host-col { width:400px; flex-shrink:0; border-left:1px solid rgba(244,120,32,.15); background:rgba(10,18,24,.92); display:flex; flex-direction:column; overflow:hidden; }
#host { flex:1; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; }
#broadcast-bar { flex-shrink:0; padding:10px 14px 12px; border-top:1px solid rgba(244,120,32,.22); background:rgba(10,18,24,.96); }
#bcast-input { width:100%; box-sizing:border-box; background:rgba(255,255,255,.05); border:1px solid rgba(244,120,32,.25); border-radius:6px; color:#fff; font-size:12px; padding:7px 9px; resize:none; font-family:inherit; margin-bottom:6px; }
#bcast-input:focus { outline:none; border-color:rgba(244,120,32,.6); }
#bcast-input::placeholder { color:rgba(255,255,255,.3); }
#btn-bcast { width:100%; padding:7px; background:rgba(244,120,32,.18); border:1px solid rgba(244,120,32,.4); border-radius:6px; color:rgba(244,120,32,.95); font-size:12px; letter-spacing:1px; font-family:'Arial Black',Arial,sans-serif; cursor:pointer; transition:background .15s; }
#btn-bcast:hover { background:rgba(244,120,32,.3); }

/* ── Slide ── */
.slide { width:100%; height:100%; border-radius:8px; position:relative; display:flex; flex-direction:column; box-shadow:0 0 60px rgba(244,120,32,.08),0 0 0 1px rgba(244,120,32,.12); overflow:hidden; background:var(--nav2); }

/* ── Setup ── */
#setup-screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
.sw { width:100%; max-width:860px; }
.sh { text-align:center; margin-bottom:26px; }
.sh h1 { font-family:'Arial Black',Arial,sans-serif; font-size:32px; color:var(--cyan); text-shadow:0 0 30px var(--cglow); margin-bottom:4px; }
.sh p { color:var(--dim); font-size:13px; }
.tc-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
.tc { background:var(--nav3); border:1.5px solid; border-radius:8px; overflow:hidden; }
.tc-h { display:flex; align-items:center; gap:8px; padding:9px 13px 7px; border-bottom:1px solid rgba(255,255,255,.06); }
.tc-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.tc-h input.tcn { flex:1; background:transparent; border:none; font-family:'Arial Black',Arial,sans-serif; font-size:14px; padding:0; min-width:0; }
.tc-h input.tcn:focus { outline:none; }
.tc-h input.tcn::placeholder { opacity:.4; }
.tc-b { padding:9px 13px 11px; }
.tc-lbl { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim2); margin-bottom:6px; }
.tc-emoji-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.tc-emoji-input { width:44px; font-size:20px; text-align:center; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:4px; padding:2px 4px; color:var(--white); }
.tc-emoji-input:focus { outline:none; border-color:rgba(255,255,255,.3); }
.emoji-presets { display:flex; gap:3px; flex-wrap:wrap; }
.ep { font-size:15px; cursor:pointer; padding:2px 3px; border-radius:3px; border:none; background:rgba(255,255,255,.05); }
.ep:hover { background:rgba(255,255,255,.12); }
.tc-mems { display:flex; flex-direction:column; gap:4px; }
.tc-mems input { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:3px; padding:4px 7px; color:var(--white); font-size:12px; font-family:inherit; }
.tc-mems input:focus { outline:none; border-color:rgba(255,255,255,.28); }
.tc-mems input::placeholder { color:rgba(255,255,255,.22); }
.btn-start { display:block; width:100%; padding:13px; background:var(--cyan); color:var(--nav); border:none; border-radius:7px; font-family:'Arial Black',Arial,sans-serif; font-size:16px; cursor:pointer; letter-spacing:1.5px; transition:opacity .15s,transform .1s; }
.btn-start:hover { opacity:.88; transform:translateY(-1px); }

/* ── Round intro ── */
.slide-ri { display:flex; flex-direction:column; justify-content:center; padding:36px 44px 36px 52px; height:100%; }
.ri-lbl { font-size:12px; letter-spacing:4px; text-transform:uppercase; margin-bottom:4px; opacity:.8; }
.ri-num { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(80px,15vw,170px); line-height:.82; margin-bottom:12px; }
.ri-name { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(20px,3.5vw,40px); margin-bottom:10px; }
.ri-sub { font-size:14px; color:var(--dim); letter-spacing:1px; }
.ri-note { margin-top:8px; font-size:11.5px; opacity:.55; }
.ri-prompt { margin-top:18px; font-size:11px; color:rgba(255,255,255,.2); }

/* ── Question ── */
.slide-q { display:flex; flex-direction:column; height:100%; }
.q-bar { display:flex; align-items:center; justify-content:space-between; padding:10px 18px; font-size:12px; border-bottom:1px solid rgba(255,255,255,.06); flex-shrink:0; }
.q-cat { font-weight:700; letter-spacing:.4px; }
.q-pos { opacity:.45; }
.q-accent { height:3px; flex-shrink:0; }
.q-body { flex:1; display:flex; align-items:center; justify-content:center; padding:28px 38px; text-align:center; overflow:hidden; }
.q-text { font-size:clamp(15px,2.1vw,27px); line-height:1.55; white-space:pre-wrap; font-weight:500; }
.q-diff { position:absolute; top:46px; right:12px; font-size:10px; letter-spacing:1px; padding:2px 6px; border-radius:10px; opacity:.55; text-transform:uppercase; }
.q-answer { flex-shrink:0; border-top:2.5px solid; padding:14px 38px 18px; text-align:center; max-height:0; overflow:hidden; opacity:0; transition:max-height .4s ease, opacity .35s ease; }
.q-answer.shown { max-height:200px; opacity:1; }
.qa-lbl { font-size:10px; letter-spacing:3px; opacity:.7; margin-bottom:4px; }
.qa-text { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(18px,3vw,38px); line-height:1.2; white-space:pre-wrap; }

/* ── Final ── */
.slide-final { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px 40px; height:100%; overflow-y:auto; }
.f-h1 { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(28px,4vw,52px); color:var(--cyan); text-shadow:0 0 30px var(--cglow); margin-bottom:6px; }
.f-winner-name { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(22px,3.5vw,44px); margin-bottom:4px; }
.f-winner-members { font-size:13px; color:var(--dim); margin-bottom:18px; }
.f-sub { color:var(--dim); font-size:13px; margin-bottom:14px; }
.f-scores { display:flex; gap:14px; width:100%; max-width:580px; margin-bottom:18px; }
.f-team { flex:1; text-align:center; }
.f-score { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(28px,4.5vw,50px); line-height:1; margin-bottom:3px; }
.f-name { font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:.8; }
.f-prize { font-size:clamp(12px,1.4vw,15px); color:var(--dim); padding:10px 20px; border:1px solid rgba(255,255,255,.12); border-radius:6px; background:rgba(255,255,255,.03); max-width:460px; }
.f-hat-img { width:100px; height:auto; display:block; margin:10px auto 6px; }

/* ── Scoreboard overlay ── */
#sb { position:fixed; inset:0; background:rgba(5,11,20,.97); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px; }
#sb.hidden { display:none; }
.sb-h { font-family:'Arial Black',Arial,sans-serif; font-size:clamp(32px,5vw,52px); color:var(--cyan); text-shadow:0 0 40px var(--cglow); text-align:center; margin-bottom:4px; }
.sb-sub { color:var(--dim); font-size:14px; text-align:center; margin-bottom:32px; }
.sb-cols { display:flex; gap:20px; align-items:flex-end; width:100%; max-width:820px; }
.sb-col { flex:1; display:flex; flex-direction:column; align-items:center; }
.sb-bw { width:100%; height:190px; display:flex; align-items:flex-end; justify-content:center; margin-bottom:9px; }
.sb-bar { width:62%; border-radius:4px 4px 0 0; min-height:4px; }
.sb-score { font-family:'Arial Black',Arial,sans-serif; font-size:40px; line-height:1; margin-bottom:3px; }
.sb-name { font-size:12px; text-transform:uppercase; letter-spacing:.8px; opacity:.8; text-align:center; }
.sb-emoji { font-size:22px; margin-bottom:2px; }
.sb-mems { font-size:10.5px; opacity:.4; margin-top:2px; text-align:center; max-width:110px; }
.btn-sb-close { margin-top:28px; padding:9px 28px; border-radius:6px; font-size:13px; cursor:pointer; letter-spacing:.8px; background:transparent; color:var(--cyan); border:1.5px solid var(--cyan); transition:background .15s; }
.btn-sb-close:hover { background:rgba(244,120,32,.1); }

/* ── Admin overlay ── */
#admin { position:fixed; inset:0; background:rgba(5,11,20,.99); z-index:400; display:flex; flex-direction:column; }
#admin.hidden { display:none; }
.admin-hdr { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:2px solid var(--cyan); flex-shrink:0; }
.admin-title { font-family:'Arial Black',Arial,sans-serif; font-size:17px; color:var(--cyan); }
.admin-subtitle { font-size:11px; color:var(--dim); margin-top:2px; }
.btn-admin-close { padding:7px 18px; border-radius:5px; border:1.5px solid rgba(244,120,32,.4); background:transparent; color:var(--cyan); font-size:12px; cursor:pointer; transition:background .12s; }
.btn-admin-close:hover { background:rgba(244,120,32,.1); }
.admin-body { display:flex; flex:1; overflow:hidden; }
.admin-sidebar { width:170px; flex-shrink:0; border-right:1px solid rgba(255,255,255,.07); overflow-y:auto; padding:10px 0; }
.admin-round-btn { display:block; width:100%; text-align:left; padding:9px 16px; border:none; background:transparent; color:rgba(255,255,255,.5); font-size:12px; cursor:pointer; transition:background .12s,color .12s,border-color .12s; border-left:3px solid transparent; }
.admin-round-btn.active { background:rgba(244,120,32,.1); color:var(--cyan); border-left-color:var(--cyan); }
.admin-round-btn:hover:not(.active) { background:rgba(255,255,255,.04); color:rgba(255,255,255,.8); }
.admin-content { flex:1; overflow-y:auto; padding:20px 28px; display:flex; flex-direction:column; gap:14px; }
.admin-q-card { background:var(--nav3); border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:16px 18px; }
.admin-q-hdr { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.admin-q-num { font-family:'Arial Black',Arial,sans-serif; font-size:13px; color:var(--dim); }
.admin-diff { font-size:10px; padding:1px 8px; border-radius:8px; }
.admin-field-lbl { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--dim2); margin-bottom:4px; margin-top:10px; }
.admin-field-lbl:first-of-type { margin-top:0; }
.admin-ta { width:100%; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.1); border-radius:5px; color:var(--white); font-size:13px; font-family:inherit; padding:8px 10px; resize:vertical; line-height:1.5; }
.admin-ta:focus { outline:none; border-color:rgba(244,120,32,.45); }
.admin-save-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
.btn-admin-save { padding:6px 18px; border-radius:4px; border:none; background:var(--cyan); color:var(--nav); font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.5px; transition:opacity .12s; }
.btn-admin-save:hover { opacity:.85; }
.admin-saved { font-size:11px; color:var(--green); font-weight:700; opacity:0; transition:opacity .25s; }
.admin-saved.show { opacity:1; }
.admin-footer { padding:10px 24px; border-top:1px solid rgba(255,255,255,.06); font-size:11px; color:rgba(255,255,255,.28); flex-shrink:0; }
.admin-diff-btns { display:flex; gap:6px; margin-top:4px; }
.admin-diff-btn { padding:3px 12px; border-radius:6px; border:1px solid rgba(255,255,255,.12); background:transparent; color:rgba(255,255,255,.4); font-size:11px; cursor:pointer; transition:all .12s; }
.admin-diff-btn:hover { border-color:rgba(255,255,255,.3); color:rgba(255,255,255,.7); }
.admin-diff-btn.active { font-weight:700; }
.admin-timed-btn { padding:5px 12px; border-radius:4px; border:1.5px solid rgba(255,255,255,.15); background:transparent; color:rgba(255,255,255,.4); font-size:11px; cursor:pointer; transition:all .12s; white-space:nowrap; }
.admin-timed-btn:hover { border-color:rgba(244,120,32,.45); color:rgba(255,255,255,.75); }
.admin-timed-btn.active { background:rgba(244,120,32,.12); border-color:var(--cyan); color:var(--cyan); }
.admin-del-btn { padding:2px 6px; border:none; background:transparent; color:rgba(255,82,82,.4); cursor:pointer; font-size:13px; flex-shrink:0; border-radius:3px; line-height:1; }
.admin-del-btn:hover { color:var(--red); background:rgba(255,82,82,.1); }
.admin-add-round-btn { display:block; width:100%; text-align:left; padding:10px 16px; border:none; border-top:1px solid rgba(255,255,255,.06); background:transparent; color:rgba(244,120,32,.55); font-size:12px; cursor:pointer; transition:color .12s,background .12s; }
.admin-add-round-btn:hover { color:var(--cyan); background:rgba(244,120,32,.06); }
.admin-rname-row { display:flex; gap:8px; align-items:center; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,.07); }
.admin-rname-input { flex:1; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.15); border-radius:5px; color:#fff; font-size:14px; font-weight:700; padding:7px 11px; font-family:inherit; }
.admin-rname-input:focus { outline:none; border-color:rgba(244,120,32,.4); }
.tc-captain-lbl { font-size:9px; background:rgba(255,215,0,.12); color:var(--gold); padding:1px 5px; border-radius:3px; letter-spacing:.5px; margin-left:4px; }

/* ── Lobby ── */
#lobby-screen { position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:16px 20px; overflow-y:auto; }
.lobby-wrap { width:100%; max-width:920px; padding-bottom:20px; }
.lobby-pool { background:var(--nav3); border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:12px 16px; margin-bottom:14px; }
.lobby-section-title { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.45); margin-bottom:10px; }
.lobby-player-row { display:flex; align-items:center; gap:6px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.04); flex-wrap:wrap; }
.lobby-player-row:last-child { border-bottom:none; }
.lobby-pname { font-size:13px; font-weight:600; min-width:100px; }
.lobby-pname.offline { opacity:.35; font-style:italic; }
.lobby-assign-btn { padding:4px 9px; border-radius:4px; border:1px solid; background:transparent; font-size:11px; cursor:pointer; white-space:nowrap; transition:all .12s; flex-shrink:0; }
.lobby-assign-btn:hover { filter:brightness(1.3); background:rgba(255,255,255,.05); }
.lobby-empty { font-size:12px; color:rgba(255,255,255,.4); font-style:italic; padding:4px 0; }
.lobby-teams { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
.lobby-team-col { background:var(--nav3); border:1.5px solid; border-radius:8px; padding:10px; min-height:80px; }
.lobby-team-hdr { font-family:'Arial Black',Arial,sans-serif; font-size:11px; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid rgba(255,255,255,.07); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lobby-member-row { display:flex; align-items:center; gap:3px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.04); }
.lobby-member-row:last-child { border-bottom:none; }
.lobby-mname { flex:1; font-size:12px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lobby-mname.offline { opacity:.35; font-style:italic; }
.lobby-cap-btn { width:22px; height:22px; border:none; background:transparent; color:var(--dim2); font-size:13px; cursor:pointer; padding:0; border-radius:3px; flex-shrink:0; line-height:1; }
.lobby-cap-btn:hover { color:var(--gold); background:rgba(255,215,0,.08); }
.lobby-cap-btn.active { color:var(--gold); }
.lobby-remove-btn { width:20px; height:20px; border:none; background:transparent; color:rgba(255,82,82,.4); font-size:11px; cursor:pointer; padding:0; border-radius:3px; flex-shrink:0; line-height:1; }
.lobby-remove-btn:hover { color:var(--red); background:rgba(255,82,82,.08); }
.lobby-empty-team { font-size:11px; color:rgba(255,255,255,.4); font-style:italic; padding:4px 0; }
.lobby-team-edit { display:flex; gap:5px; align-items:center; margin-bottom:6px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,.07); }
.lobby-team-name-input { flex:1; min-width:0; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,.15); color:var(--white); font-family:'Arial Black',Arial,sans-serif; font-size:12px; padding:2px 4px; outline:none; }
.lobby-team-name-input:focus { border-bottom-color:var(--cyan); }
.lobby-team-emoji-input { width:30px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:3px; color:var(--white); font-size:16px; text-align:center; padding:1px 2px; outline:none; }
.lobby-team-emoji-input:focus { border-color:rgba(255,255,255,.3); }

/* ── Host sidebar ── */
.hp { padding:11px 14px; border-bottom:1px solid rgba(255,255,255,.05); flex-shrink:0; }
.hp:last-child { border-bottom:none; }
.hp-lbl { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--dim2); margin-bottom:8px; }
.nav-row { display:flex; gap:6px; }
.btn-nav { flex:1; padding:9px 6px; border-radius:5px; border:1.5px solid rgba(244,120,32,.25); background:rgba(244,120,32,.04); color:rgba(255,255,255,.8); font-size:13px; font-weight:700; cursor:pointer; transition:background .12s; }
.btn-nav:hover { background:rgba(244,120,32,.1); color:#fff; }
.btn-nav.pri { background:var(--cyan); color:var(--nav); border-color:var(--cyan); }
.btn-nav.pri:hover { opacity:.88; }
.btn-rev { width:100%; padding:9px; border-radius:5px; border:2px solid; font-size:13px; font-weight:700; cursor:pointer; letter-spacing:.8px; transition:all .15s; }
.btn-rev.show { background:var(--green); border-color:var(--green); color:var(--nav); }

<script>

// ── ROUNDS (must match server.js) ────────────────────────────────────────────
const ROUNDS = [

    {q:'What country has won the most FIFA World Cup titles?\n(Bonus: how many times?)',a:'Brazil — 5 times\n(1958, 1962, 1970, 1994, 2002)',d:1},
    {q:'Who holds the NFL record for most career rushing yards, and with which team did he spend the majority of his career?',a:'Emmitt Smith · Dallas Cowboys',d:2},

    {q:'What country produces more than 60% of the world\'s vanilla supply?',a:'Madagascar',d:2},
    {q:'Which country consumes the most chocolate per capita in the world?',a:'Switzerland',d:2},
    {q:'"Ceviche" is a dish where raw seafood is "cooked" without heat.\nWhat country is credited as its origin, and what acid is traditionally used to cure the fish?',a:'Peru · Lime juice (citric acid)',d:3},

const DIFF_LABEL = {1:'Easy',2:'Medium',3:'Hard'};
const DIFF_COLOR = {1:'rgba(0,230,118,.5)',2:'rgba(255,183,77,.5)',3:'rgba(255,82,82,.5)'};
const DIFF_BG    = {1:'rgba(0,230,118,.18)',2:'rgba(255,183,77,.18)',3:'rgba(255,82,82,.18)'};
const TEAM_COLORS = ['#00C8FF','#FF6B6B','#FFD700','#00E676','#BB86FC','#FFB74D','#FF8A65','#80DEEA'];
const EMOJI_PRESETS = ['🐆','🦁','🐯','🦊','🦅','🐺','🐻','🦈','🦋','🐉','🦄','🎯'];

// ── Socket ────────────────────────────────────────────────────────────────────
const socket = io();
socket.emit('register:host');

let S = null;
let T = { sec:30, running:false };

function emit(ev, data) { socket.emit(ev, data); }
socket.on('state', s => { S = s; render(); });
socket.on('timer', t => { T = t; refreshTimer(); });

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (!S || S.phase === 'setup' || S.phase === 'lobby') return;
  switch(e.key) {
    case ' ': case 'ArrowRight': e.preventDefault(); emit('host:next'); break;
    case 'ArrowLeft':            e.preventDefault(); emit('host:prev'); break;
    case 'a': case 'A':         if (S.phase==='q') emit('host:reveal'); break;
    case 't': case 'T':         emit('host:timer',{action: T.running?'stop':'start'}); break;
    case 'r': case 'R':         emit('host:timer',{action:'reset'}); break;
    case 's': case 'S':         emit('host:scoreboard'); break;
    case 'Escape':              closeSb(); closeAdmin(); break;
  }
});

// ── Broadcast ────────────────────────────────────────────────────────────────
function sendBroadcast() {
  const el = document.getElementById('bcast-input');
  if (!el) return;
  const msg = el.value.trim();
  if (!msg) return;
  emit('host:broadcast', { msg });
  el.value = '';
}
document.getElementById('bcast-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBroadcast(); }
});

// ── Restart ───────────────────────────────────────────────────────────────────
let restartTimer = null;
function confirmRestart() {
  const btn = document.getElementById('btn-restart');
  if (btn.dataset.confirming) {
    clearTimeout(restartTimer);
    delete btn.dataset.confirming;
    btn.textContent = '↺ Restart';
    btn.classList.remove('confirming');
    emit('host:restart');
  } else {
    btn.dataset.confirming = '1';
    btn.textContent = '⚠ Confirm?';
    btn.classList.add('confirming');
    restartTimer = setTimeout(() => {
      delete btn.dataset.confirming;
      btn.textContent = '↺ Restart';
      btn.classList.remove('confirming');
    }, 3000);
  }
}

// ── Admin portal ──────────────────────────────────────────────────────────────
let adminRound = 0;

function openAdmin() {
  document.getElementById('admin').classList.remove('hidden');
  renderAdminSidebar();
  renderAdminQuestions();
}
function closeAdmin() { document.getElementById('admin').classList.add('hidden'); }

function renderAdminSidebar() {
  document.getElementById('admin-sidebar').innerHTML =
    ROUNDS.map((r, i) => `
      <div style="display:flex;align-items:center;">
        <button class="admin-round-btn ${i===adminRound?'active':''}" style="flex:1;min-width:0;"
          onclick="selectAdminRound(${i})">
          <span style="font-size:10px;opacity:.5;">R${i+1}</span> ${esc(r.name)}
        </button>
        <button class="admin-del-btn" onclick="deleteRound(${i})" title="Delete round">✕</button>
      </div>`).join('') +
    `<button class="admin-add-round-btn" onclick="addRound()">＋ Add Round</button>`;
}

function selectAdminRound(idx) {
  adminRound = idx;
  renderAdminSidebar();
  renderAdminQuestions();
}

function renderAdminQuestions() {
  const ri = adminRound;
  const round = ROUNDS[ri];
  if (!round) return;
  document.getElementById('admin-questions').innerHTML =
    `<div class="admin-rname-row">
       <input class="admin-rname-input" id="aq-rname" type="text" value="${escAttr(round.name)}" placeholder="Round name">
       <button class="btn-admin-save" onclick="saveRoundName(${ri})">Rename</button>
       <button class="admin-timed-btn ${round.timed !== false ? 'active' : ''}"
         onclick="setRoundTimed(${ri}, ${round.timed !== false ? 'false' : 'true'})">
         ${round.timed !== false ? '⏱ Timed' : '⏱ No Timer'}
       </button>
     </div>
     <div style="display:flex;gap:6px;align-items:flex-start;margin-bottom:10px;">
       <textarea class="admin-ta" id="aq-note" rows="2" placeholder="Subtitle / note shown on round intro slide (optional)" style="flex:1;">${escAttr(round.note||'')}</textarea>
       <button class="btn-admin-save" style="flex-shrink:0;margin-top:0;" onclick="saveRoundNote(${ri})">Save</button>
     </div>` +
    round.questions.map((q, qi) => `
      <div class="admin-q-card">
        <div class="admin-q-hdr">
          <span class="admin-q-num">Q${qi+1}</span>
        </div>
        <div class="admin-field-lbl">Difficulty</div>
        <div class="admin-diff-btns" id="aq-d-${ri}-${qi}">
          ${[1,2,3].map(d=>`<button class="admin-diff-btn${q.d===d?' active':''}" data-d="${d}"
            style="${q.d===d?'background:'+DIFF_BG[d]+';color:'+DIFF_COLOR[d].replace('.5)','.9)')+';border-color:'+DIFF_COLOR[d].replace('.5)','.4)'):''};"
            onclick="setDiff(${ri},${qi},${d})">${DIFF_LABEL[d]} (+${d}pt)</button>`).join('')}
        </div>
        <div class="admin-field-lbl">Question</div>
        <textarea class="admin-ta" id="aq-q-${ri}-${qi}" rows="3">${escAttr(q.q)}</textarea>
        <div class="admin-field-lbl">Answer</div>
        <textarea class="admin-ta" id="aq-a-${ri}-${qi}" rows="2">${escAttr(q.a)}</textarea>
        <div class="admin-save-row">
          <button class="btn-admin-save" onclick="saveAdminQ(${ri},${qi})">Save</button>
          <span class="admin-saved" id="aq-msg-${ri}-${qi}">✓ Saved</span>
        </div>
      </div>`).join('') +
    `<button onclick="addQuestion(${ri})"
       style="width:100%;padding:10px;border:1px dashed rgba(255,255,255,.15);border-radius:6px;background:transparent;color:rgba(255,255,255,.35);font-size:12px;cursor:pointer;margin-top:4px;"
       onmouseover="this.style.borderColor='rgba(255,255,255,.3)';this.style.color='rgba(255,255,255,.6)'"
       onmouseout="this.style.borderColor='rgba(255,255,255,.15)';this.style.color='rgba(255,255,255,.35)'">
      ＋ Add Question
    </button>`;
}

function saveAdminQ(ri, qi) {
  const qEl = document.getElementById(`aq-q-${ri}-${qi}`);
  const aEl = document.getElementById(`aq-a-${ri}-${qi}`);
  if (!qEl || !aEl) return;
  const newQ = qEl.value;
  const newA = aEl.value;
  const newD = ROUNDS[ri].questions[qi].d;
  ROUNDS[ri].questions[qi].q = newQ;
  ROUNDS[ri].questions[qi].a = newA;
  emit('host:editQuestion', { roundIdx: ri, qIdx: qi, q: newQ, a: newA, d: newD });
  const msg = document.getElementById(`aq-msg-${ri}-${qi}`);
  if (msg) { msg.classList.add('show'); setTimeout(() => msg.classList.remove('show'), 1500); }
}

function setDiff(ri, qi, d) {
  ROUNDS[ri].questions[qi].d = d;
  const container = document.getElementById(`aq-d-${ri}-${qi}`);
  if (!container) return;
  container.querySelectorAll('.admin-diff-btn').forEach(btn => {
    const bd = parseInt(btn.dataset.d);
    const on = bd === d;
    btn.classList.toggle('active', on);
    btn.style.background    = on ? DIFF_BG[d]    : '';
    btn.style.color         = on ? DIFF_COLOR[d].replace('.5)','.9)') : '';
    btn.style.borderColor   = on ? DIFF_COLOR[d].replace('.5)','.4)') : '';
  });
}

function saveRoundName(ri) {
  const input = document.getElementById('aq-rname');
  if (!input) return;
  const name = input.value.trim() || ROUNDS[ri].name;
  ROUNDS[ri].name = name;
  emit('host:renameRound', { roundIdx: ri, name });
  renderAdminSidebar();
}

function saveRoundNote(ri) {
  const el = document.getElementById('aq-note');
  if (!el) return;
  const note = el.value.trim();
  ROUNDS[ri].note = note;
  emit('host:setRoundNote', { roundIdx: ri, note });
}

function setRoundTimed(ri, val) {
  ROUNDS[ri].timed = (val === true || val === 'true');
  emit('host:setRoundTimed', { roundIdx: ri, timed: ROUNDS[ri].timed });
  renderAdminQuestions();
}

function addRound() {
  const newRound = {
    name: 'New Round',
    color: '#00C8FF',
    note: '',
    timed: true,
    questions: Array.from({length:5}, (_,i) => ({ q: `Question ${i+1}`, a: `Answer ${i+1}`, d: 2 }))
  };
  ROUNDS.push(newRound);
  adminRound = ROUNDS.length - 1;
  emit('host:addRound', newRound);
  renderAdminSidebar();
  renderAdminQuestions();
}

function deleteRound(idx) {
  if (ROUNDS.length <= 1) { alert('Must keep at least one round.'); return; }
  if (!confirm(`Delete "${ROUNDS[idx].name}"? This cannot be undone.`)) return;
  ROUNDS.splice(idx, 1);
  if (adminRound >= ROUNDS.length) adminRound = ROUNDS.length - 1;
  emit('host:deleteRound', idx);
  renderAdminSidebar();
  renderAdminQuestions();
}

function addQuestion(ri) {
  ROUNDS[ri].questions.push({ q: 'New question', a: 'Answer', d: 2 });
  renderAdminQuestions();
}

// ── Scoreboard ────────────────────────────────────────────────────────────────
function openSb() {
  if (!S) return;
  document.getElementById('sb-sub').textContent =
    S.phase === 'final' ? 'Final Standings' : `After Round ${S.round} — standings so far`;
  const maxSc = Math.max(...S.teams.map(t=>t.score), 1);
  document.getElementById('sb-cols').innerHTML = S.teams.map(t => {
    const h = Math.max((t.score/maxSc)*180, 4);
    const mems = (t.members||[]).filter(Boolean).join(', ');
    return `<div class="sb-col">
      <div class="sb-bw"><div class="sb-bar" style="background:${t.color};height:${h}px;box-shadow:0 0 14px ${t.color}66;"></div></div>
      ${t.emoji?`<div class="sb-emoji">${t.emoji}</div>`:''}
      <div class="sb-score" style="color:${t.color};text-shadow:0 0 18px ${t.color}55">${t.score}</div>
      <div class="sb-name" style="color:${t.color}">${esc(t.name)}</div>
      ${mems?`<div class="sb-mems">${esc(mems)}</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('sb').classList.remove('hidden');
}
function closeSb() { document.getElementById('sb').classList.add('hidden'); }

// ── Render ────────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function render() {
  if (!S) return;
  renderScoreBar();
  renderDisplay();
  renderHost();
  if (S.scoreboardOpen) openSb(); else closeSb();
  const gnEl = document.getElementById('hdr-game-name');
  if (gnEl) gnEl.textContent = S.gameName || '';
}

function renderScoreBar() {
  if (!S || S.phase==='setup' || S.phase==='lobby') { document.getElementById('score-bar').innerHTML=''; return; }
  document.getElementById('score-bar').innerHTML = S.teams.map((t,i)=>`
    <div class="sc-chip" style="color:${t.color};border-color:${t.color}44;">
      <div class="sc-n">${t.emoji?t.emoji+' ':''}${esc(t.name)}</div>
      <div class="sc-v">${t.score}</div>
    </div>`).join('');
}

function refreshTimer() {
  const el = document.getElementById('timer-val');
  if (!el) return;
  el.textContent = T.sec;
  el.style.color = T.sec<=5?'var(--red)':T.sec<=10?'var(--orange)':'var(--green)';
  const btn = document.getElementById('btn-tt');
  if(btn){ btn.textContent=T.running?'⏸ Pause':'▶ Start'; btn.className='btn-t'+(T.running?' on':''); }
}

function renderDisplay() {
  const el = document.getElementById('display');
  if (!S) return;
  if (S.phase==='setup') { el.innerHTML=renderSetup(); bindSetup(); return; }
  if (S.phase==='lobby') { el.innerHTML=renderLobby(); bindLobby(); return; }
  if (S.phase==='ri')    { el.innerHTML=renderRI(); return; }
  if (S.phase==='q')     { el.innerHTML=renderQ(); return; }
  if (S.phase==='final') { el.innerHTML=renderFinal(); return; }
}

function renderSetup() {
  return `<div id="setup-screen"><div class="sw" style="max-width:480px;text-align:center;">
    <div class="sh">
      <h1 style="color:#ffffff;text-shadow:none;">TEAM TRIVIA</h1>
      <p>GlassHouse · Name this event so players know they're in the right place</p>
    </div>
    <input id="game-name-input" type="text" maxlength="60" placeholder="e.g. Friday Night Trivia · May 30"
      style="width:100%;margin-top:16px;padding:11px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:15px;text-align:center;font-family:inherit;outline:none;"
      onkeydown="if(event.key==='Enter')document.getElementById('btn-start').click()">
    <button class="btn-start" id="btn-start" style="margin-top:10px;">OPEN LOBBY →</button>
  </div></div>`;
}

function bindSetup() {
  document.getElementById('btn-start').onclick = () => {
    const gameName = document.getElementById('game-name-input').value.trim() || 'Trivia Night';
    const teams = [0,1,2,3].map(i=>({ name: `Team ${i+1}`, emoji: '' }));
    emit('host:createTeams', { teams, gameName });
  };
}

function renderRI() {
  const col = S.roundColor;
  const localRound = ROUNDS[S.round];
  const numQ   = localRound?.questions.length || 0;
  const numPts = localRound ? localRound.questions.reduce((s,q)=>s+(q.d||1),0) : 0;
  return `<div class="slide fade-in" style="background:${col}0D;border:1px solid ${col}2A;">
    <div style="position:absolute;left:0;top:0;width:6px;height:100%;background:${col};border-radius:8px 0 0 8px;"></div>
    <div class="slide-ri" style="padding-left:52px;">
      <div class="ri-lbl" style="color:${col}">ROUND ${S.roundNum} OF ${S.roundTotal}</div>
      <div class="ri-num" style="color:${col}">${S.roundNum}</div>
      <div class="ri-name" style="color:${col}">${esc(S.roundName)}</div>
      <div class="ri-sub">${numQ} Question${numQ!==1?'s':''} · ${numPts} Points Up For Grabs</div>
      ${S.roundNote?`<div class="ri-note" style="color:${col}">${esc(S.roundNote)}</div>`:''}
      <div class="ri-prompt">Press Space or → to begin</div>
    </div>
  </div>`;
}

function renderQ() {
  const col = S.roundColor;
  const localQ = ROUNDS[S.round]?.questions[S.qIdx];
  const diff = localQ?.d;
  return `<div class="slide fade-in" style="background:var(--nav2);border:1px solid ${col}22;">
    <div class="slide-q">
      <div class="q-bar" style="border-bottom-color:${col}2A;">
        <span class="q-cat" style="color:${col}">Round ${S.roundNum} · ${esc(S.roundName)}</span>
        <span class="q-pos">Q${S.qIdx+1} / ${S.qTotal}</span>
      </div>
      <div class="q-accent" style="background:${col};"></div>
      <div class="q-body"><div class="q-text">${esc(S.qText)}</div></div>
      <div class="q-answer ${S.answerShown?'shown':''}" style="border-top-color:${col};background:${col}0F;">
        <div class="qa-lbl" style="color:${col}">ANSWER</div>
        <div class="qa-text">${esc(S.aText)}</div>
      </div>
    </div>
    ${diff?`<div class="q-diff" style="background:${DIFF_COLOR[diff]}">${DIFF_LABEL[diff]} · +${diff}pt</div>`:''}
  </div>`;
}

function renderFinal() {
  const sorted = [...S.teams].map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const winner = sorted[0];
  const winMembers = (winner.members||[]).filter(Boolean);
  const medals = ['🥇','🥈','🥉'];
  return `<div class="slide fade-in" style="background:var(--nav2);border:1px solid rgba(244,120,32,.2);">
    <div class="slide-final">
      <div class="f-h1">🎉 CONGRATULATIONS!</div>
      <div class="f-winner-name" style="color:${winner.color};text-shadow:0 0 20px ${winner.color}55;">
        ${winner.emoji?winner.emoji+' ':''}${esc(winner.name)}
      </div>
      ${winMembers.length?`<div class="f-winner-members">${winMembers.map(m=>esc(m)).join(' · ')}</div>`:''}
      <div class="f-sub">Final Standings · 45 questions played</div>
      <div class="f-scores">
        ${sorted.map((t,rank)=>`<div class="f-team">
          <div style="font-size:20px;margin-bottom:2px;">${medals[rank]||rank+1}</div>
          <div class="f-score" style="color:${t.color};">${t.score}</div>
          <div class="f-name" style="color:${t.color}">${t.emoji?t.emoji+' ':''}${esc(t.name)}</div>
        </div>`).join('')}
      </div>
      <img src="hat.png" alt="Prize hat" class="f-hat-img" onerror="this.style.display='none'">
      <div class="f-prize">🎩 The winning team each takes home a GlassHouse company hat! Great game, everyone!</div>
    </div>
  </div>`;
}

function renderHost() {
  const el = document.getElementById('host');
  const bbar = document.getElementById('broadcast-bar');
  const hide = !S || S.phase==='setup' || S.phase==='lobby' || S.phase==='final';
  if (bbar) bbar.style.display = hide ? 'none' : '';
  if (hide) { el.innerHTML=''; el.style.display='none'; return; }
  el.style.display='';
  const isQ = S.phase==='q';
  const col = S.roundColor;
  const localQ = isQ ? ROUNDS[S.round]?.questions[S.qIdx] : null;

  el.innerHTML = `
    <div class="hp">
      <div class="hp-lbl">Navigation</div>
      <div class="nav-row">
        <button class="btn-nav" onclick="emit('host:prev')">← Prev</button>
        <button class="btn-nav pri" onclick="emit('host:next')">Next →</button>
      </div>
    </div>

    ${isQ ? `<div class="hp">
      <button class="btn-rev ${S.answerShown?'hide':'show'}" onclick="emit('host:reveal')">
        ${S.answerShown?'↑ Hide Answer':'▶ Reveal Answer'}
      </button>
    </div>` : ''}

    <div class="hp">
      <div class="hp-lbl">Now Playing</div>
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <div style="flex:1;min-width:0;">
          <div class="pos-txt" style="color:${col}">Round ${S.roundNum}${isQ?', Q'+(S.qIdx+1):' — Intro'}</div>
          <div class="pos-sub">${esc(S.roundName)}</div>
        </div>
        ${isQ ? `<div style="flex-shrink:0;text-align:right;">
          <div id="timer-val" style="font-size:38px;">${T.sec}</div>
          <div class="timer-row" style="gap:4px;margin-top:3px;">
            <button class="btn-t ${T.running?'on':''}" id="btn-tt" style="padding:4px 7px;"
              onclick="emit('host:timer',{action: T.running?'stop':'start'})">
              ${T.running?'⏸':'▶'}
            </button>
            <button class="btn-t" style="padding:4px 7px;" onclick="emit('host:timer',{action:'reset'})">↺</button>
          </div>
        </div>` : ''}
      </div>
    </div>

    ${isQ ? `<div class="hp">
      <div class="hp-lbl">
        Team Answers
        ${S.answerShown?'':' <span style="opacity:.4;font-size:9px;">— hidden until you reveal</span>'}
      </div>
      ${S.teams.map((t,i)=>{
        const ans = S.answers[i]||{answer:'',submitted:false};
        const res = S.results[i];
        const resultBar = res==='correct'
          ? `<div class="tr-result" style="background:rgba(0,230,118,.15);color:var(--green)">✓ CORRECT</div>`
          : res==='wrong'
            ? `<div class="tr-result" style="background:rgba(255,82,82,.1);color:var(--red)">✗ WRONG</div>`
            : '';
        return `<div class="team-row" style="border-color:${t.color}2A;">
          <div class="tr-head" style="background:${t.color}12;">
            <div class="tr-nw">
              <div class="tr-dot" style="background:${t.color}"></div>
              <div class="tr-name" style="color:${t.color}">${t.emoji?t.emoji+' ':''}${esc(t.name)}</div>
            </div>
            <div class="tr-score" style="color:${t.color}">${t.score}</div>
          </div>
          <div class="tr-ans">
            ${S.answerShown
              ? (ans.submitted
                  ? `<span class="tr-ans-txt">${esc(ans.answer)}</span>`
                  : `<span class="tr-ans-none">No answer submitted</span>`)
              : (ans.submitted
                  ? `<span class="tr-ans-received">✓ Answer received</span>`
                  : `<span class="tr-ans-pending">Waiting…</span>`)}
          </div>
          ${resultBar}
          ${S.answerShown?`<div class="tr-btns">
            <button class="btn-ok yes" onclick="emit('host:score',{teamIdx:${i},delta:${localQ?.d||1}})">✓ +${localQ?.d||1}</button>
            <button class="btn-ok no"  onclick="emit('host:score',{teamIdx:${i},delta:${-(localQ?.d||1)}})">✗ Undo</button>
          </div>`:''}
        </div>`;
      }).join('')}
      ${localQ && S.answerShown?`<div class="host-ans-box" style="margin-top:8px;">
        <div class="host-ans-lbl">✓ Correct Answer</div>
        <div class="host-ans-txt">${esc(localQ.a)}</div>
      </div>`:''}
    </div>` : ''}

    <div class="hp">
      <div class="hp-lbl">Shortcuts</div>
      <div class="keys">
        <b>Space / →</b> Next &nbsp; <b>←</b> Prev<br>
        <b>A</b> Reveal &nbsp; <b>T</b> Timer &nbsp; <b>R</b> Reset<br>
        <b>S</b> Scoreboard &nbsp; <b>Esc</b> Close
      </div>
    </div>
  `;
  refreshTimer();
}


// ── Lobby ─────────────────────────────────────────────────────────────────
let players = [];

socket.on('players:update', p => {
  players = p;
  if (S && S.phase === 'lobby') {
    document.getElementById('display').innerHTML = renderLobby();
    bindLobby();
  }
});

function renderLobby() {
  const unassigned = players.filter(p => p.teamIdx === null);
  const teams = S ? S.teams : [];

  return `<div id="lobby-screen"><div class="lobby-wrap">
    <div class="sh">
      <h1 style="font-size:24px;color:#ffffff;text-shadow:none;">PLAYER ASSIGNMENT</h1>
      <p>Players join at the link below · Assign them to teams · Designate a captain per team</p>
    </div>

    <div class="lobby-pool">
      <div class="lobby-section-title">WAITING TO JOIN (${unassigned.length})</div>
      ${unassigned.length === 0
        ? '<div class="lobby-empty">No unassigned players yet — share the /play link!</div>'
        : unassigned.map(p => `
          <div class="lobby-player-row">
            <span class="lobby-pname ${!p.sid ? 'offline' : ''}">${esc(p.name)}${!p.sid ? ' (offline)' : ''}</span>
            ${teams.map((t, i) => `
              <button class="lobby-assign-btn" style="border-color:${t.color};color:${t.color};"
                onclick="assignPlayer(${esc(JSON.stringify(p.name))}, ${i})">
                → ${esc(t.name)}
              </button>`).join('')}
          </div>`).join('')}
    </div>

    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button onclick="emit('host:addTeam')" ${teams.length >= 8 ? 'disabled' : ''}
        style="flex:1;padding:8px;border-radius:6px;border:1px dashed rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:12px;cursor:pointer;">
        ＋ Add Team
      </button>
      <button onclick="emit('host:removeTeam')" ${teams.length <= 1 ? 'disabled' : ''}
        style="flex:1;padding:8px;border-radius:6px;border:1px dashed rgba(255,82,82,.3);background:transparent;color:rgba(255,82,82,.7);font-size:12px;cursor:pointer;">
        − Remove Last Team
      </button>
    </div>

    <div class="lobby-teams">
      ${teams.map((t, i) => {
        const tp = players.filter(p => p.teamIdx === i);
        return `<div class="lobby-team-col" style="border-color:${t.color}44;">
          <div class="lobby-team-edit">
            <input class="lobby-team-emoji-input" id="lt-emoji-${i}"
              value="${escAttr(t.emoji)}" maxlength="2" placeholder="🏆"
              style="border-color:${t.color}44;"
              onblur="saveTeamEmoji(${i})"
              onkeydown="if(event.key==='Enter')this.blur()">
            <input class="lobby-team-name-input" id="lt-name-${i}"
              value="${escAttr(t.name)}" placeholder="Team ${i+1} Name"
              style="color:${t.color};"
              onblur="saveTeamName(${i})"
              onkeydown="if(event.key==='Enter')this.blur()">
          </div>
          <div class="emoji-presets" style="display:flex;gap:2px;flex-wrap:wrap;margin-bottom:8px;">
            ${EMOJI_PRESETS.map(e=>`<button class="ep" onclick="setTeamEmoji(${i},'${e}')">${e}</button>`).join('')}
          </div>
          <div style="font-size:10px;color:rgba(255,255,255,.45);margin-bottom:6px;">${tp.length} player${tp.length!==1?'s':''}</div>
          ${tp.length === 0
            ? '<div class="lobby-empty-team">Empty — assign players above</div>'
            : tp.map(p => `
              <div class="lobby-member-row">
                <span class="lobby-mname ${!p.sid ? 'offline' : ''}">${esc(p.name)}</span>
                <button class="lobby-cap-btn ${p.isCaptain ? 'active' : ''}"
                  onclick="setCaptain(${esc(JSON.stringify(p.name))}, ${i})" title="${p.isCaptain ? 'Captain' : 'Make Captain'}">★</button>
                <button class="lobby-remove-btn"
                  onclick="removePlayer(${esc(JSON.stringify(p.name))})" title="Remove from team">✕</button>
              </div>`).join('')}
        </div>`;
      }).join('')}
    </div>

    <button class="btn-start" id="btn-start-game">START GAME ▶</button>
  </div></div>`;
}

function bindLobby() {
  const btn = document.getElementById('btn-start-game');
  if (btn) btn.onclick = () => emit('host:startGame');
}

function assignPlayer(name, teamIdx) { emit('host:assignPlayer', { name, teamIdx }); }
function setCaptain(name, teamIdx)   { emit('host:setCaptain',   { name, teamIdx }); }
function removePlayer(name)          { emit('host:removePlayer', { name }); }

function saveTeamName(i) {
  const el = document.getElementById(`lt-name-${i}`);
  if (el) emit('host:renameTeam', { teamIdx: i, name: el.value });
}
function saveTeamEmoji(i) {
  const el = document.getElementById(`lt-emoji-${i}`);
  if (el) emit('host:renameTeam', { teamIdx: i, emoji: el.value });
}
function setTeamEmoji(i, emoji) {
  const el = document.getElementById(`lt-emoji-${i}`);
  if (el) { el.value = emoji; emit('host:renameTeam', { teamIdx: i, emoji }); }
}

// Initial render
S = { phase:'setup', teams:[
  {name:'Team 1',members:[],score:0,color:'#00C8FF',emoji:''},
  {name:'Team 2',members:[],score:0,color:'#FF6B6B',emoji:''},
  {name:'Team 3',members:[],score:0,color:'#FFD700',emoji:''},
  {name:'Team 4',members:[],score:0,color:'#00E676',emoji:''},
]};
render();
</script>
</body>
</html>
