<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GlassHouse Trivia — Team View</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/socket.io/socket.io.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:  #0A1218;
    --navy2: #080E14;
    --cyan:  #F47820;
    --cyan2: #D05E0A;
    --gold:  #FFD700;
    --green: #00E676;
    --red:   #FF6B6B;
    --card:  rgba(255,255,255,0.05);
    --border: rgba(244,120,32,0.22);
  }

  html, body {
    height: 100%;
    background: var(--navy2);
    color: #E8F4FD;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(244,120,32,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244,120,32,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  #app { position: relative; z-index: 1; min-height: 100vh; }

  /* ── TEAM SELECT ──────────────────────────────────────────────── */
  #teamSelect {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 24px 16px;
    gap: 20px;
  }

  .logo-area { text-align: center; }
  .logo-area .brand { font-size: 13px; letter-spacing: 4px; color: var(--cyan); text-transform: uppercase; opacity: 0.8; }
  .logo-area h1 { font-size: clamp(26px, 6vw, 40px); font-weight: 800; color: #fff; margin-top: 6px; line-height: 1.1; }
  .logo-area p  { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 8px; }

  .team-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%; max-width: 420px;
  }

  .team-btn {
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 22px 14px;
    text-align: center;
    cursor: pointer;
    background: var(--card);
    backdrop-filter: blur(6px);
    transition: transform .15s, border-color .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .team-btn:active { transform: scale(0.96); }
  .team-btn .t-emoji { font-size: 32px; margin-bottom: 8px; line-height: 1; }
  .team-btn .t-color-bar { width: 40px; height: 5px; border-radius: 3px; margin: 0 auto 10px; }
  .team-btn .t-name { font-size: 17px; font-weight: 700; color: #fff; word-break: break-word; }
  .team-btn .t-members { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 6px; line-height: 1.5; }

  /* ── GAME VIEW ────────────────────────────────────────────────── */
  #gameView { display: none; flex-direction: column; min-height: 100vh; }
  .play-body { flex: 1; display: flex; max-width: 1300px; margin: 0 auto; width: 100%; }
  @media (max-width: 699px) { .play-body { flex-direction: column; } }

  /* Header */
  .play-header {
    background: rgba(8,18,31,0.95);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(8px);
  }
  .play-header .team-chip {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700;
  }
  .team-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .team-emoji-hdr { font-size: 18px; line-height: 1; }
  .change-team-btn {
    background: none; border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.45); font-size: 11px;
    padding: 3px 8px; border-radius: 6px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .change-team-btn:active { background: rgba(255,255,255,0.1); }

  /* Timer pill */
  .timer-pill {
    font-size: 22px; font-weight: 800; letter-spacing: 1px;
    padding: 4px 14px; border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--cyan);
    transition: color .3s, background .3s;
    font-variant-numeric: tabular-nums;
  }
  .timer-pill.urgent { color: var(--red); background: rgba(255,107,107,0.12); }

  /* Main content */
  .play-main {
    flex: 1; display: flex; flex-direction: column;
    padding: 20px 16px; gap: 16px;
    min-width: 0;
  }

  /* Auto-assign button */
  .auto-assign-btn {
    width: 100%; max-width: 420px; padding: 13px;
    background: var(--cyan); color: var(--navy2);
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 800; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .15s, transform .1s;
  }
  .auto-assign-btn:active { transform: scale(0.98); }
  .auto-assign-note { font-size: 12px; color: rgba(255,255,255,0.4); text-align: center; max-width: 420px; margin-top: 8px; }
  .team-btn.is-my-team { border-width: 2.5px !important; }
  .my-team-badge {
    display: inline-block; margin-top: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    color: var(--green); background: rgba(0,230,118,0.15);
    padding: 2px 8px; border-radius: 8px;
  }

  /* Captain / suggestion UI */
  .answer-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .captain-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    color: var(--gold); background: rgba(255,215,0,0.12);
    padding: 2px 8px; border-radius: 8px;
  }
  .suggest-btn {
    margin-top: 12px; width: 100%;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.75); border-radius: 12px;
    font-size: 15px; font-weight: 700; padding: 13px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: background .15s;
  }
  .suggest-btn:active { background: rgba(255,255,255,0.13); }

  /* Round badge */
  .round-badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    font-weight: 700; color: var(--cyan);
    opacity: 0.8;
  }
  .round-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Question card */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px;
    backdrop-filter: blur(6px);
  }
  .q-num { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .q-text {
    font-size: clamp(17px, 4vw, 22px);
    font-weight: 600;
    line-height: 1.45;
    color: #fff;
    white-space: pre-wrap;
  }
  .q-diff { display: inline-block; margin-top: 12px; font-size: 11px; padding: 2px 10px; border-radius: 10px; }
  .diff-1 { background: rgba(0,230,118,0.15); color: #00E676; }
  .diff-2 { background: rgba(255,215,0,0.15);  color: #FFD700; }
  .diff-3 { background: rgba(255,107,107,0.15); color: #FF6B6B; }

  /* Answer form */
  .answer-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(6px);
  }
  .answer-label { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }

  .answer-input {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    padding: 14px 16px;
    outline: none;
    resize: vertical;
    min-height: 70px;
    font-family: inherit;
    transition: border-color .2s;
  }
  .answer-input:focus { border-color: var(--cyan); }
  .answer-input:disabled { opacity: 0.4; cursor: not-allowed; }

  .submit-btn {
    margin-top: 12px; width: 100%;
    background: var(--cyan); color: var(--navy2);
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 800;
    padding: 15px;
    cursor: pointer;
    transition: background .2s, transform .1s;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 0.5px;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { background: rgba(244,120,32,0.3); color: rgba(255,255,255,0.4); cursor: not-allowed; }
  .submit-btn.submitted { background: var(--green); color: #003320; }

  .submit-status {
    text-align: center; margin-top: 10px;
    font-size: 13px; font-weight: 600;
    min-height: 18px;
  }
  .submit-status.ok  { color: var(--green); }
  .submit-status.err { color: var(--red); }

  /* Answer reveal */
  .answer-reveal {
    background: rgba(244,120,32,0.08);
    border: 1.5px solid rgba(244,120,32,0.35);
    border-radius: 16px;
    padding: 18px 20px;
    animation: fadeIn .4s ease;
  }
  .answer-reveal .ar-label { font-size: 11px; color: var(--cyan); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .answer-reveal .ar-text  { font-size: 18px; font-weight: 700; color: #fff; white-space: pre-wrap; line-height: 1.4; }

  /* Result banner */
  .result-banner {
    border-radius: 14px; padding: 16px 20px;
    text-align: center; font-size: 22px; font-weight: 800;
    animation: popIn .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    letter-spacing: 0.5px;
  }
  .result-banner.correct { background: rgba(0,230,118,0.2); border: 2px solid #00E676; color: #00E676; }
  .result-banner.wrong   { background: rgba(255,107,107,0.2); border: 2px solid #FF6B6B; color: #FF6B6B; }

  /* Scoreboard strip */
  .score-strip {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .score-chip {
    flex: 1; min-width: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    text-align: center;
    font-size: 12px;
  }
  .score-chip .sc-emoji { font-size: 18px; line-height: 1; margin-bottom: 2px; }
  .score-chip .sc-name { font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .score-chip .sc-pts  { font-size: 20px; font-weight: 800; }

  /* Waiting states */
  .waiting-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 24px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .waiting-card .wc-icon { font-size: 48px; margin-bottom: 16px; }
  .waiting-card h2 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 8px; }
  .waiting-card p  { font-size: 14px; color: rgba(255,255,255,0.45); line-height: 1.6; }

  /* Round intro card */
  .round-intro-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 24px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .round-intro-card .ri-num  { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); margin-bottom: 10px; }
  .round-intro-card .ri-name { font-size: clamp(24px, 6vw, 36px); font-weight: 800; color: #fff; margin-bottom: 8px; }
  .round-intro-card .ri-note { font-size: 13px; color: rgba(255,255,255,0.45); margin-top: 6px; }

  /* Final screen */
  .final-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 24px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .final-card .winner-emoji { font-size: 52px; margin-bottom: 8px; }
  .final-card h2 { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 4px; }
  .final-card .winner-name { font-size: 28px; font-weight: 900; margin-bottom: 6px; }
  .final-card .winner-members { font-size: 14px; color: rgba(255,255,255,0.55); margin-bottom: 20px; line-height: 1.6; }

  .podium { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .podium-row {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 12px 16px;
  }
  .podium-rank { font-size: 20px; width: 28px; text-align: center; }
  .podium-info { flex: 1; text-align: left; }
  .podium-name { font-weight: 700; color: #fff; font-size: 16px; }
  .podium-pts  { font-size: 13px; color: rgba(255,255,255,0.45); }
  .final-hat-img { width: 90px; height: auto; display: block; margin: 16px auto 8px; }
  .final-prize-txt { font-size: 13px; color: rgba(255,255,255,0.45); margin-top: 4px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes popIn  { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

  /* Header score chips */
  .header-scores { display: flex; gap: 6px; flex: 1; justify-content: center; overflow: hidden; min-width: 0; }
  .header-score-chip { display: flex; flex-direction: column; align-items: center; padding: 3px 10px 4px; border-radius: 4px; border: 1.5px solid; min-width: 60px; }
  .header-score-chip .hsc-n { font-size: 8px; opacity: .7; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; overflow: hidden; max-width: 80px; text-overflow: ellipsis; }
  .header-score-chip .hsc-v { font-family: 'Arial Black', Arial, sans-serif; font-size: 18px; line-height: 1.1; }

  /* Content timer */
  .round-badge-row { display: flex; align-items: center; justify-content: space-between; }
  .content-timer { font-family: 'Arial Black', Arial, sans-serif; font-size: 30px; font-weight: 900; color: var(--cyan); min-width: 50px; text-align: right; line-height: 1; transition: color .3s; }

  /* Team roster card */
  .team-roster-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    backdrop-filter: blur(6px);
  }
  .roster-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.38); margin-bottom: 8px; }
  .roster-team-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .roster-emoji { font-size: 20px; line-height: 1; }
  .roster-name { font-size: 15px; font-weight: 700; }
  .roster-members { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .roster-member { font-size: 13px; color: rgba(255,255,255,0.65); }
  .roster-member.is-me { color: #fff; font-weight: 700; }

  .hidden { display: none !important; }

  /* ── PLAYER NAME INPUT ──────────────────────────────────────────── */
  .name-input-wrap { width: 100%; max-width: 420px; }
  .player-name-input {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: #fff; font-size: 15px;
    padding: 12px 16px; outline: none;
    font-family: inherit; -webkit-appearance: none;
    text-align: center;
  }
  .player-name-input::placeholder { color: rgba(255,255,255,0.3); }
  .player-name-input:focus { border-color: var(--cyan); }

  /* ── TEAM CHAT PANEL ─────────────────────────────────────────────── */

  /* Base (shared) */
  #chatPanel {
    display: flex; flex-direction: column;
    background: rgba(8,18,31,0.96);
    border-top: 1px solid var(--border);
  }
  #chatPanel.hidden { display: none !important; }

  /* Mobile: in-flow block below main content */
  @media (max-width: 699px) {
    #chatPanel {
      width: 100%; flex-shrink: 0;
      max-height: 300px;
    }
    #chatPanel.collapsed #chatBody { display: none; }
  }

  /* Desktop: sticky sidebar, full height */
  @media (min-width: 700px) {
    #chatPanel {
      position: sticky;
      top: 60px;
      align-self: flex-start;
      width: clamp(340px, 40%, 560px); flex-shrink: 0;
      height: calc(100vh - 60px);
      max-height: none;
      border-top: none;
      border-left: 1px solid var(--border);
      overflow: hidden;
    }
    #chatPanel.collapsed #chatBody { display: flex; }
    .chat-toggle-icon { display: none; }
    .chat-header { cursor: default; }
    #chatBody {
      flex: 1; overflow: hidden; min-height: 0;
      display: flex; flex-direction: column;
    }
    .chat-messages { flex: 1; overflow-y: auto; }
  }

  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; cursor: pointer; flex-shrink: 0;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .chat-header-left { display: flex; align-items: center; gap: 8px; }
  .chat-title { font-size: 13px; font-weight: 700; color: var(--cyan); }
  .chat-unread-badge {
    background: var(--red); color: #fff;
    font-size: 10px; font-weight: 800;
    padding: 1px 6px; border-radius: 10px;
    min-width: 18px; text-align: center;
    animation: popIn .2s ease;
  }
  .chat-toggle-icon { font-size: 11px; color: rgba(255,255,255,0.35); }

  #chatBody { display: flex; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 4px 16px 8px;
    display: flex; flex-direction: column; gap: 4px;
    min-height: 0;
  }
  .chat-msg { font-size: 13px; line-height: 1.45; word-break: break-word; }
  .chat-author { font-weight: 700; margin-right: 2px; }
  .chat-author.is-me    { color: var(--green); }
  .chat-author.is-other { color: var(--cyan);  }
  .chat-text  { color: rgba(255,255,255,0.85); }
  .chat-msg.bcast { background: rgba(244,120,32,0.13); border-left: 2px solid var(--cyan); border-radius: 4px; padding: 4px 8px; margin: 3px 0; }
  .chat-empty { font-size: 12px; color: rgba(255,255,255,0.3); text-align: center; padding: 12px 0; }

  .chat-input-row {
    display: flex; gap: 8px;
    padding: 8px 12px 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1; background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    border-radius: 10px; color: #fff;
    font-size: 14px; padding: 9px 12px;
    outline: none; font-family: inherit;
    resize: none; line-height: 1.4;
    min-height: 42px;
  }
  .chat-input:focus { border-color: var(--cyan); }
  .chat-send-btn {
    background: var(--cyan); color: var(--navy2);
    border: none; border-radius: 10px;
    font-size: 18px; font-weight: 800;
    width: 44px; align-self: flex-end;
    min-height: 42px;
    cursor: pointer; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-send-btn:active { opacity: 0.8; }
  .chat-input-row { align-items: flex-end; }
</style>
</head>
<body>
<div id="app">

  <!-- ════ JOIN SCREEN ════ -->
  <div id="teamSelect">
    <div class="logo-area">
      <img src="https://framerusercontent.com/images/s57APls4GZFCEILzorWpqOuQSo.png?scale-down-to=512" alt="GlassHouse" style="height:44px;width:auto;display:block;margin:0 auto 12px;">
      <h1>Trivia Night</h1>
      <p>Enter your name to join</p>
    </div>
    <div class="name-input-wrap">
      <input type="text" id="playerNameInput" class="player-name-input"
        placeholder="Your name" maxlength="30" autocomplete="off">
    </div>
    <button class="auto-assign-btn" id="joinBtn">Join Game</button>
    <div id="joinStatus" style="font-size:13px;color:rgba(255,255,255,0.45);text-align:center;min-height:20px;"></div>
  </div>

  <!-- ════ GAME VIEW ════ -->
  <div id="gameView">

    <div class="play-header">
      <div class="team-chip" id="teamChip">
        <div class="team-dot" id="headerDot"></div>
        <span class="team-emoji-hdr" id="headerEmoji"></span>
        <span id="headerTeamName">Your Team</span>
      </div>
      <div id="headerScores" class="header-scores"></div>
      <button class="change-team-btn" id="changeTeamBtn">← Back</button>
    </div>

    <div class="play-body">
      <div class="play-main" id="mainContent"></div>

      <!-- Chat panel lives here as a sidebar on desktop, fixed bottom on mobile -->
      <div id="chatPanel" class="hidden">
        <div class="chat-header" id="chatHeader">
          <div class="chat-header-left">
            💬&nbsp;<span class="chat-title" id="chatTitle">Team Chat</span>
            <span class="chat-unread-badge hidden" id="chatUnread"></span>
          </div>
          <span class="chat-toggle-icon" id="chatToggleIcon">▼</span>
        </div>
        <div id="chatBody">
          <div class="chat-messages" id="chatMessages">
            <div class="chat-empty">Say something to get started!</div>
          </div>
          <div class="chat-input-row">
            <textarea class="chat-input" id="chatInput" rows="3"
              placeholder="Message your team…" maxlength="200" autocomplete="off"></textarea>
            <button class="chat-send-btn" id="chatSendBtn">↑</button>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
(function() {
  const socket = io();

  let state         = null;
  let timer         = { sec: 30, running: false };
  let teamIdx       = null;
  let playerJoined  = false; // true once play:join emitted this session

  // ── Chat ─────────────────────────────────────────────────────────
  let playerName    = (localStorage.getItem('gh_name') || '').trim();
  let chatJoined    = -1;
  let chatCollapsed = false;
  let chatUnreadCt  = 0;

  // ── State ────────────────────────────────────────────────────────

  // ── Persistence ─────────────────────────────────────────────────
  function loadTeam() {
    const v = localStorage.getItem('gh_team');
    return v !== null ? parseInt(v, 10) : null;
  }
  function saveTeam(idx) { localStorage.setItem('gh_team', String(idx)); }
  function clearTeam()   { localStorage.removeItem('gh_team'); teamIdx = null; chatJoined = -1; }

  // ── DOM refs ─────────────────────────────────────────────────────
  const $teamSelect  = document.getElementById('teamSelect');
  const $gameView    = document.getElementById('gameView');
  const $main        = document.getElementById('mainContent');
  const $headerDot   = document.getElementById('headerDot');
  const $headerName  = document.getElementById('headerTeamName');
  const $headerEmoji = document.getElementById('headerEmoji');
  const $joinStatus  = document.getElementById('joinStatus');

  const $chatPanel   = document.getElementById('chatPanel');
  const $chatMsgs    = document.getElementById('chatMessages');
  const $chatInput   = document.getElementById('chatInput');
  const $chatUnread  = document.getElementById('chatUnread');
  const $chatToggle  = document.getElementById('chatToggleIcon');
  const $chatTitle   = document.getElementById('chatTitle');

  document.getElementById('changeTeamBtn').addEventListener('click', () => {
    clearTeam(); playerJoined = false; showJoinScreen();
  });

  // ── View switching ───────────────────────────────────────────────
  function showJoinScreen() {
    $teamSelect.style.display = 'flex';
    $gameView.style.display   = 'none';
    $chatPanel.classList.add('hidden');
    $joinStatus.textContent = '';
    document.getElementById('playerNameInput').value = playerName;
  }

  function showWaiting() {
    $teamSelect.style.display = 'flex';
    $gameView.style.display   = 'none';
    $chatPanel.classList.add('hidden');
    $joinStatus.textContent = '⏳ Waiting for the host to assign your team…';
  }

  function showGame() {
    $teamSelect.style.display = 'none';
    $gameView.style.display   = 'flex';
    $chatPanel.classList.remove('hidden');
    updateHeader();
    joinTeamChat();
    render();
  }

  // ── Header ───────────────────────────────────────────────────────
  function updateHeader() {
    if (!state || teamIdx === null) return;
    const team = state.teams[teamIdx];
    if (!team) return;
    $headerDot.style.background = team.color;
    $headerName.textContent = team.name;
    $headerEmoji.textContent = team.emoji || '';
    updateChatTitle();
  }

  // ── Timer display ────────────────────────────────────────────────
  function updateTimerDisplay() {
    const s = timer.sec;
    const ct = document.getElementById('contentTimer');
    if (ct) {
      ct.textContent = String(s);
      ct.style.color = s <= 5 ? 'var(--red)' : s <= 10 ? '#FFB74D' : 'var(--cyan)';
    }
  }

  // ── Header score chips ───────────────────────────────────────────
  function updateHeaderScores() {
    const el = document.getElementById('headerScores');
    if (!el) return;
    if (!state || !state.teams || state.phase === 'setup' || state.phase === 'lobby') {
      el.innerHTML = ''; return;
    }
    el.innerHTML = state.teams.map(t =>
      `<div class="header-score-chip" style="color:${t.color};border-color:${t.color}44;">
        <div class="hsc-n">${t.emoji ? t.emoji + ' ' : ''}${esc(t.name)}</div>
        <div class="hsc-v">${t.score}</div>
      </div>`
    ).join('');
  }

  // ── Chat ─────────────────────────────────────────────────────────
  function joinTeamChat() {
    if (teamIdx === null || teamIdx === chatJoined) return;
    chatJoined = teamIdx;
    socket.emit('chat:join', teamIdx);
    updateChatTitle();
  }

  function updateChatTitle() {
    if (!state || teamIdx === null || !state.teams || !state.teams[teamIdx]) return;
    const t = state.teams[teamIdx];
    $chatTitle.textContent = t.name + ' Chat';
    $chatTitle.style.color = t.color;
  }

  function toggleChat() {
    chatCollapsed = !chatCollapsed;
    $chatPanel.classList.toggle('collapsed', chatCollapsed);
    $chatToggle.textContent = chatCollapsed ? '▲' : '▼';
    if (!chatCollapsed) { chatUnreadCt = 0; renderUnread(); scrollChat(); }
  }

  function renderUnread() {
    if (chatUnreadCt > 0) {
      $chatUnread.textContent = chatUnreadCt > 9 ? '9+' : String(chatUnreadCt);
      $chatUnread.classList.remove('hidden');
    } else {
      $chatUnread.classList.add('hidden');
    }
  }

  function scrollChat() { $chatMsgs.scrollTop = $chatMsgs.scrollHeight; }

  function addMsgEl(entry, isMe) {
    const empty = $chatMsgs.querySelector('.chat-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    if (entry.broadcast) {
      div.className = 'chat-msg bcast';
      div.innerHTML = `<span class="chat-author" style="color:var(--cyan)">📢 Host:</span> <span class="chat-text">${esc(entry.msg)}</span>`;
    } else {
      const color = isMe ? 'var(--green)' : chatColor(entry.name);
      div.className = 'chat-msg';
      div.innerHTML = `<span class="chat-author" style="color:${color}">${esc(entry.name)}:</span> <span class="chat-text">${esc(entry.msg)}</span>`;
    }
    $chatMsgs.appendChild(div);
  }

  function sendChat() {
    const msg = $chatInput.value.trim();
    if (!msg || teamIdx === null) return;
    socket.emit('chat:send', { teamIdx, name: playerName || 'Anonymous', msg });
    $chatInput.value = '';
  }

  // ── Captain check ────────────────────────────────────────────────
  function isCaptain() {
    if (!state || teamIdx === null) return true;
    const t = state.teams[teamIdx];
    if (!t || !t.captainName) return true; // no captain set → everyone submits
    if (!playerName) return false;
    return playerName.toLowerCase() === t.captainName.toLowerCase();
  }

  // ── Main render ──────────────────────────────────────────────────
  function render() {
    if (!state || teamIdx === null) return;
    updateHeaderScores();
    if (state.phase === 'setup' || state.phase === 'lobby') {
      $main.innerHTML = waitingHTML('⏳', 'Game Starting Soon', 'The host is setting things up. Hang tight!');
    } else if (state.phase === 'final') { renderFinal(); }
    else if (state.phase === 'ri')      { renderRoundIntro(); }
    else if (state.phase === 'q')       { renderQuestion(); }
  }

  function waitingHTML(icon, title, sub) {
    return `<div class="waiting-card">
      <div class="wc-icon">${icon}</div>
      <h2>${title}</h2>
      <p>${sub}</p>
    </div>` + teamRosterHTML();
  }

  function renderRoundIntro() {
    const color = state.roundColor || '#00C8FF';
    const note  = state.roundNote ? `<div class="ri-note">${esc(state.roundNote)}</div>` : '';

    $main.innerHTML = `
      <div class="round-badge-row">
        <div class="round-badge">
          <div class="round-badge-dot" style="background:${color}"></div>
          Round ${state.roundNum} of ${state.roundTotal}
        </div>
      </div>
      <div class="round-intro-card">
        <div class="ri-num" style="color:${color}">Round ${state.roundNum}</div>
        <div class="ri-name" style="color:${color}">${esc(state.roundName)}</div>
        <div class="ri-note" style="color:rgba(255,255,255,0.55);margin-top:6px;">${state.qTotal} Question${state.qTotal!==1?'s':''} · ${state.roundPoints} Points Up For Grabs</div>
        ${note}
      </div>
      ${teamRosterHTML()}
    `;
  }

  function renderQuestion() {
    const color = state.roundColor || '#00C8FF';
    const diffLabels = { 1: 'Easy', 2: 'Medium', 3: 'Hard' };
    const diff = state.qDiff;
    const diffCls = diff === 1 ? 'diff-1' : diff === 2 ? 'diff-2' : 'diff-3';

    const myAns    = state.answers?.[teamIdx] || null;
    const myResult = state.results?.[teamIdx]  || null;
    const submitted  = myAns?.submitted || false;
    const answerText = myAns?.answer   || '';

    const revealHTML = state.aText
      ? `<div class="answer-reveal">
           <div class="ar-label">✓ Correct Answer</div>
           <div class="ar-text">${esc(state.aText)}</div>
         </div>`
      : '';

    let resultHTML = '';
    if (myResult === 'correct') resultHTML = `<div class="result-banner correct">✓ Correct! +${state.qDiff||1} point${(state.qDiff||1)!==1?'s':''}</div>`;
    else if (myResult === 'wrong') resultHTML = `<div class="result-banner wrong">✗ Not this time</div>`;

    const captain    = state.teams[teamIdx]?.captainName || '';
    const amCaptain  = isCaptain();

    const answerSection = amCaptain
      ? `<div class="answer-card">
           <div class="answer-label-row">
             <div class="answer-label">Your Answer</div>
             ${captain ? `<span class="captain-badge">★ Captain</span>` : ''}
           </div>
           <textarea class="answer-input" id="answerInput"
             placeholder="Type your team's answer…" rows="3"
             ${myResult ? 'disabled' : ''}>${esc(answerText)}</textarea>
           <button class="submit-btn${submitted ? ' submitted' : ''}" id="submitBtn">
             ${submitted ? '✓ Answer Submitted' : 'Submit Answer'}
           </button>
           <div class="submit-status" id="submitStatus"></div>
         </div>`
      : `<div class="answer-card" style="text-align:center;padding:18px 20px;">
           <div style="font-size:22px;margin-bottom:8px;">💬</div>
           <div style="font-size:13px;color:rgba(255,255,255,.5);line-height:1.5;">
             Use team chat to suggest an answer to
             ${captain ? `<strong style="color:#fff">${esc(captain)}</strong>` : 'your captain'}
           </div>
         </div>`;

    $main.innerHTML = `
      <div class="round-badge-row">
        <div class="round-badge">
          <div class="round-badge-dot" style="background:${color}"></div>
          ${esc(state.roundName)} &nbsp;·&nbsp; Q${state.qIdx + 1} of ${state.qTotal}
        </div>
        ${state.roundTimed !== false ? `<div class="content-timer" id="contentTimer">${timer.sec}</div>` : ''}
      </div>
      <div class="q-card">
        <div class="q-num">Question ${state.qIdx + 1}</div>
        <div class="q-text">${esc(state.qText)}</div>
        ${diff ? `<span class="q-diff ${diffCls}">${diffLabels[diff] || ''} · +${diff}pt</span>` : ''}
      </div>
      ${revealHTML}
      ${resultHTML}
      ${answerSection}
      ${teamRosterHTML()}
    `;
    updateTimerDisplay();

    if (amCaptain) {
      const $input  = document.getElementById('answerInput');
      const $btn    = document.getElementById('submitBtn');
      const $status = document.getElementById('submitStatus');
      $btn.addEventListener('click', () => {
        const answer = $input.value.trim();
        if (!answer) { $status.className='submit-status err'; $status.textContent='Please type an answer first.'; return; }
        socket.emit('play:answer', { round: state.round, qIdx: state.qIdx, teamIdx, answer });
        $btn.classList.add('submitted'); $btn.textContent = '✓ Answer Submitted';
        $status.className = 'submit-status ok';
        $status.textContent = 'Submitted! You can update until the next question.';
      });
      $input.addEventListener('input', () => {
        if ($input.value.trim()) { $btn.classList.remove('submitted'); $btn.textContent = 'Submit Answer'; $status.textContent = ''; }
      });
    }
  }

  function renderFinal() {
    const sorted = [...(state.teams || [])]
      .map((t, i) => ({ ...t, _i: i }))
      .sort((a, b) => b.score - a.score);

    const winner  = sorted[0];
    const medals  = ['🥇','🥈','🥉'];
    const members = (winner.members || []).filter(Boolean);

    const rows = sorted.map((t, rank) => `
      <div class="podium-row">
        <div class="podium-rank">${medals[rank] || (rank + 1)}</div>
        <div class="podium-info">
          <div class="podium-name">${t.emoji ? t.emoji + ' ' : ''}${esc(t.name)}</div>
          <div class="podium-pts" style="color:${t.color}">${t.score} pts</div>
        </div>
      </div>
    `).join('');

    $main.innerHTML = `
      <div class="final-card">
        ${winner.emoji ? `<div class="winner-emoji">${winner.emoji}</div>` : '<div class="winner-emoji">🎉</div>'}
        <h2>Congratulations,</h2>
        <div class="winner-name" style="color:${winner.color}">${esc(winner.name)}!</div>
        ${members.length ? `<div class="winner-members">${members.map(m => esc(m)).join('<br>')}</div>` : ''}
        <div class="podium">${rows}</div>
        <img src="hat.png" alt="Prize hat" class="final-hat-img" onerror="this.style.display='none'">
        <div class="final-prize-txt">Winners take home a GlassHouse company hat — great game everyone!</div>
      </div>
    `;
  }

  function scoreStripHTML() {
    if (!state || !state.teams || state.teams.length === 0) return '';
    const chips = state.teams.map(t => `
      <div class="score-chip">
        ${t.emoji ? `<div class="sc-emoji">${t.emoji}</div>` : ''}
        <div class="sc-name" style="color:${t.color}">${esc(t.name)}</div>
        <div class="sc-pts" style="color:${t.color}">${t.score}</div>
      </div>
    `).join('');
    return `<div class="score-strip">${chips}</div>`;
  }

  function teamRosterHTML() {
    if (!state || teamIdx === null) return '';
    const t = state.teams[teamIdx];
    if (!t) return '';
    const members = (t.members || []).filter(Boolean);
    const memberItems = members.map(m => {
      const isCap = t.captainName && m.toLowerCase() === t.captainName.toLowerCase();
      const isMe  = playerName && m.toLowerCase() === playerName.toLowerCase();
      return `<span class="roster-member${isMe ? ' is-me' : ''}">` +
        esc(m) +
        (isCap ? `<span style="color:var(--gold)"> ★</span>` : '') +
        (isMe  ? `<span style="color:var(--green);font-size:10px;"> (you)</span>` : '') +
        `</span>`;
    }).join('');
    return `<div class="team-roster-card">
      <div class="roster-label">YOUR TEAM</div>
      <div class="roster-team-hdr">
        ${t.emoji ? `<span class="roster-emoji">${t.emoji}</span>` : ''}
        <span class="roster-name" style="color:${t.color}">${esc(t.name)}</span>
      </div>
      ${members.length ? `<div class="roster-members">${memberItems}</div>` : ''}
    </div>`;
  }

  // ── Socket events ────────────────────────────────────────────────
  socket.on('state', s => {
    state = s;

    // If game was restarted and our team slot vanished, go back to join
    if (teamIdx !== null && (!s.teams || !s.teams[teamIdx])) {
      clearTeam(); playerJoined = false; showJoinScreen(); return;
    }

    if (teamIdx !== null) { updateHeader(); joinTeamChat(); render(); }
    // else: player is on join/waiting screen — leave them there
  });

  socket.on('play:joined', ({ teamIdx: idx }) => {
    teamIdx = idx;
    saveTeam(idx);
    chatJoined = -1; // force chat re-join for new team
    showGame();
  });

  socket.on('play:waiting', () => {
    showWaiting();
  });

  socket.on('chat:history', history => {
    $chatMsgs.innerHTML = '';
    if (!history.length) {
      $chatMsgs.innerHTML = '<div class="chat-empty">Say something to get started!</div>';
      return;
    }
    history.forEach(e => addMsgEl(e, !!(playerName && e.name === playerName)));
    scrollChat();
  });

  socket.on('chat:msg', entry => {
    const isMe = !!(playerName && entry.name === playerName);
    addMsgEl(entry, isMe);
    scrollChat();
    if (chatCollapsed && !isMe) { chatUnreadCt++; renderUnread(); }
  });

  socket.on('chat:broadcast', entry => {
    addMsgEl(entry, false);
    scrollChat();
    chatUnreadCt++; renderUnread();
  });

  socket.on('timer', t => {
    timer = t;
    updateTimerDisplay();
  });

  // ── Chat event listeners ─────────────────────────────────────────
  document.getElementById('chatHeader').addEventListener('click', toggleChat);
  document.getElementById('chatSendBtn').addEventListener('click', sendChat);
  $chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  // ── Player name input ────────────────────────────────────────────
  const $nameIn = document.getElementById('playerNameInput');
  $nameIn.value = playerName;
  $nameIn.addEventListener('input', () => {
    playerName = $nameIn.value.trim();
    localStorage.setItem('gh_name', playerName);
  });
  $nameIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doJoin(); }
  });

  // ── Join button ──────────────────────────────────────────────────
  function doJoin() {
    const name = $nameIn.value.trim();
    if (!name) { $joinStatus.textContent = 'Please enter your name first.'; return; }
    playerName = name;
    localStorage.setItem('gh_name', name);
    socket.emit('play:join', { name });
    playerJoined = true;
    $joinStatus.textContent = '⏳ Joining…';
  }
  document.getElementById('joinBtn').addEventListener('click', doJoin);

  // ── Init ─────────────────────────────────────────────────────────
  teamIdx = loadTeam();
  // Auto-reconnect: if name is stored, re-emit play:join immediately
  if (playerName) {
    socket.emit('play:join', { name: playerName });
    playerJoined = true;
    if (teamIdx !== null) {
      // Optimistic: show game right away; server will confirm or correct
      showGame();
    } else {
      showWaiting();
    }
  } else {
    showJoinScreen();
  }

  // ── Chat colors ──────────────────────────────────────────────────
  const CHAT_COLORS = ['#00C8FF','#FFB74D','#BB86FC','#F48FB1','#80DEEA','#FF8A65','#A5D6A7','#90CAF9','#FFCC02','#CF6679'];
  function chatColor(name) {
    if (!name) return '#aaa';
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (Math.imul(31, h) + name.charCodeAt(i)) | 0;
    return CHAT_COLORS[Math.abs(h) % CHAT_COLORS.length];
  }

  // ── Utils ────────────────────────────────────────────────────────
  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/\n/g, '<br>');
  }
})();
</script>
</body>
</html>
